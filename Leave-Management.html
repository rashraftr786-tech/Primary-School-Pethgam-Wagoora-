<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave Management</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#17324a}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0}.item{border-top:1px solid #ddd;padding:14px 0}.btn{border:0;border-radius:9px;padding:9px 12px;margin:4px;background:#5d3fd3;color:#fff}.reject{background:#b42318}.mod{background:#9a6700}</style></head><body><div class=wrap><div class=card><h1>Leave Management</h1><p id=gate>Checking access…</p><a href=index.html>Back to ERP</a></div><div class=card><div id=list>Loading…</div></div></div><script>(function(){let auth,db;firebase.initializeApp(window.GPS_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const q=await db.collection('studentLeaves').get();let a=[];q.forEach(d=>a.push({id:d.id,...d.data()}));a.sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt)));document.getElementById('list').innerHTML=a.length?a.map(x=>'<div class=item><b>'+esc(x.studentName)+'</b> · '+esc(x.admissionNo)+'<br>'+esc(x.leaveType)+' · '+esc(x.startDate)+' → '+esc(x.endDate)+'<br>'+esc(x.reason)+'<br>Status: <b>'+esc(x.status||'Pending')+'</b><br><button class=btn onclick="act(\''+x.id+'\',\'Approved\')">Approve</button><button class="btn reject" onclick="act(\''+x.id+'\',\'Rejected\')">Reject</button><button class="btn mod" onclick="act(\''+x.id+'\',\'Modification Required\')">Request Modification</button>'+(x.attachment?.downloadURL?' <a target=_blank href="'+x.attachment.downloadURL+'">Attachment</a>':'')+'</div>').join(''):'No applications.'}window.act=async(id,status)=>{const remarks=prompt('Remarks (optional):','')||'';await db.collection('studentLeaves').doc(id).update({status,adminRemarks:remarks,actedBy:auth.currentUser.uid,actedAt:new Date().toISOString(),updatedAt:new Date().toISOString()});await db.collection('auditHistory').add({module:'studentLeaves',applicationId:id,action:'STATUS_CHANGE',newStatus:status,remarks,actingUid:auth.currentUser.uid,actingRole:'admin/hoi',timestamp:new Date().toISOString()});load()};auth.onAuthStateChanged(async u=>{if(!u)return location.href='Role-Login.html';const d=await db.collection('admins').doc(u.uid).get();if(!d.exists||d.data().active!==true||!['admin','hoi'].includes(String(d.data().role).toLowerCase()))return document.getElementById('gate').textContent='Unauthorized.';document.getElementById('gate').textContent='Access verified.';load()})})()</script></body></html>
