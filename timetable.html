<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Timetable Management - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>Timetable Management</h1><p>Create and print class-wise weekly timetables.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>Class</label><select id="class"><option>Pre-Primary</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="field"><label>Session</label><input id="session" value="2026-2027"></div><div class="field"><label>Day</label><select id="day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select></div><div class="field"><label>Period</label><input id="period" placeholder="1"></div><div class="field"><label>Time</label><input id="time" placeholder="09:00–09:40"></div><div class="field"><label>Subject</label><input id="subject"></div><div class="field"><label>Teacher</label><input id="teacher"></div><div class="field"><label>Room</label><input id="room"></div></div><div class="actions"><button class="btn ok" onclick="saveSlot()">Save Period</button><button class="btn secondary" onclick="clearForm()">Clear</button><button class="btn light" onclick="window.print()">Print Timetable</button></div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Day</th><th>Period</th><th>Time</th><th>Subject</th><th>Teacher</th><th>Room</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const KEY='GPSPETHGAM_TIMETABLE_V1';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function clearForm(){period.value='';time.value='';subject.value='';teacher.value='';room.value=''}function saveSlot(){if(!period.value||!subject.value)return alert('Enter period and subject.');let a=data();a.push({id:crypto.randomUUID(),className:document.getElementById('class').value,session:session.value,day:day.value,period:period.value,time:time.value,subject:subject.value,teacher:teacher.value,room:room.value});save(a);clearForm();render()}function del(id){save(data().filter(x=>x.id!==id));render()}function render(){let c=document.getElementById('class').value,sess=session.value,a=data().filter(x=>x.className===c&&x.session===sess).sort((x,y)=>['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].indexOf(x.day)-['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].indexOf(y.day)||Number(x.period)-Number(y.period));rows.innerHTML=a.map(x=>`<tr><td>${x.day}</td><td>${x.period}</td><td>${x.time||'—'}</td><td><b>${x.subject}</b></td><td>${x.teacher||'—'}</td><td>${x.room||'—'}</td><td><button class="btn danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No periods added for this class/session.</td></tr>'}document.getElementById('class').onchange=render;session.oninput=render;render();
</script></body></html>
