<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff & Teacher Management — GPS Pethgam Wagoora</title><style>
:root{--blue:#0056b3;--navy:#12355b;--gold:#d4a72c;--bg:#f4f7fb;--card:#fff;--muted:#64748b;--border:#dbe4ef;--danger:#c0392b;--ok:#16803c}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172033}header{background:linear-gradient(135deg,#0056b3,#12355b);color:#fff;padding:20px}header .head{max-width:1200px;margin:auto;display:flex;gap:16px;align-items:center}header img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.9}.wrap{max-width:1200px;margin:20px auto;padding:0 14px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #12355b12}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.field textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#64748b}.btn.ok{background:var(--ok)}.btn.danger{background:var(--danger)}.btn.gold{background:#a87900}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px;border-radius:12px;background:#eef5ff;border:1px solid #d6e7ff}.stat b{display:block;font-size:25px;color:var(--blue)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--border);padding:9px;text-align:left;font-size:13px;vertical-align:top}th{background:#f1f5f9;color:#334155}.table-wrap{overflow:auto}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f1ff;color:#0757a6;font-size:11px;font-weight:700}.muted{color:var(--muted)}.empty{text-align:center;padding:25px;color:var(--muted)}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}a.back{color:#fff;text-decoration:none;font-weight:700}.notice{padding:10px;border-radius:8px;background:#fff7db;border:1px solid #f0d57a;margin-bottom:12px}.photo-preview{width:96px;height:96px;border-radius:14px;object-fit:cover;border:1px solid var(--border);background:#e2e8f0;display:block;margin-top:8px}@media(max-width:800px){.grid,.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:500px){.grid,.stats{grid-template-columns:1fr}header .head{align-items:flex-start}h1{font-size:20px}}</style></head><body><header><div class="head"><img src="new-logo.png" alt="School Logo"><div><h1>Staff & Teacher Management</h1><p>Maintain a simple staff master register used by staff attendance, leave and timetable modules.</p></div><div style="margin-left:auto"><a class="back" href="index.html">← Dashboard</a></div></div></header><main class="wrap"><div class="card"><h2>Add / Edit Staff</h2><input type="hidden" id="id"><div class="grid"><div class="field"><label>Name *</label><input id="name"></div><div class="field"><label>Staff Photo</label><input id="staffPhoto" type="file" accept="image/*" onchange="previewPhoto(event)"><img id="photoPreview" class="photo-preview" alt="Staff photo preview" style="display:none"></div><div class="field"><label>Designation</label><input id="designation" placeholder="Teacher / Head Teacher / Staff"></div><div class="field"><label>Employee ID</label><input id="employeeId"></div><div class="field"><label>Mobile</label><input id="mobile"></div><div class="field"><label>Joining Date</label><input id="joiningDate" type="date"></div><div class="field"><label>Subject / Role</label><input id="role"></div><div class="field"><label>Access Role</label><select id="accessRole"><option value="Staff">Staff</option><option value="HOI">HOI</option></select></div><div class="field"><label>Personal Access PIN</label><input id="accessPin" type="password" inputmode="numeric" maxlength="8" placeholder="Set 4–8 digit PIN"></div><div class="field"><label>Status</label><select id="status"><option>Active</option><option>On Leave</option><option>Inactive</option></select></div></div><div class="actions"><button class="btn ok" onclick="saveStaff()">Save Staff</button><button class="btn secondary" onclick="resetForm()">Clear</button></div></div><div class="card"><div class="topbar"><h2>Staff Register</h2><input id="q" placeholder="Search staff" style="padding:9px;border:1px solid #cbd5e1;border-radius:8px"></div><div class="table-wrap"><table><thead><tr><th>Photo</th><th>Name</th><th>Employee ID</th><th>Designation</th><th>Role</th><th>Mobile</th><th>Access</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const KEY='GPSPETHGAM_STAFF_V1';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function get(){try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function put(a){localStorage.setItem(KEY,JSON.stringify(a))}function saveStaff(){let name=document.getElementById('name').value.trim();if(!name)return alert('Enter staff name.');let employeeId=document.getElementById('employeeId').value.trim();let a=get(),id=document.getElementById('id').value||((window.crypto && typeof window.crypto.randomUUID==='function')?window.crypto.randomUUID():('staff-'+Date.now()+'-'+Math.random().toString(36).slice(2))),i=a.findIndex(x=>x.id===id),old=i>=0?a[i]:null;if(employeeId && a.some(x=>x.employeeId===employeeId && x.id!==id))return alert('This Employee ID is already registered.');let pin=document.getElementById('accessPin').value.trim(); if(pin && !/^\d{4,8}$/.test(pin)) return alert('PIN must contain 4 to 8 digits.'); let photo=document.getElementById('photoPreview').dataset.value||old?.photo||'';let obj={id,name,designation:document.getElementById('designation').value.trim(),employeeId,mobile:document.getElementById('mobile').value.trim(),joiningDate:document.getElementById('joiningDate').value,role:document.getElementById('role').value.trim(),accessRole:document.getElementById('accessRole').value,accessPin:pin||old?.accessPin||'',photo,status:document.getElementById('status').value,updatedAt:new Date().toISOString()};if(i>=0)a[i]=obj;else a.unshift(obj);try{put(a)}catch(e){return alert('Unable to save this staff record. Browser storage may be full. Please use a smaller photo or remove an unused staff photo.')}alert('Staff record saved successfully.');resetForm();render()}function editStaff(id){let s=get().find(x=>x.id===id);if(!s)return;Object.keys(s).forEach(k=>{let e=document.getElementById(k);if(e)e.value=s[k]||''});if(s.photo){document.getElementById('photoPreview').src=s.photo;document.getElementById('photoPreview').style.display='block';document.getElementById('photoPreview').dataset.value=s.photo}else{document.getElementById('photoPreview').style.display='none';document.getElementById('photoPreview').dataset.value=''} document.getElementById('accessRole').value=s.accessRole||'Staff'; document.getElementById('accessPin').value=s.accessPin||''; document.getElementById('status').value=s.status||'Active';document.getElementById('id').value=id;scrollTo(0,0)}function delStaff(id){if(confirm('Delete this staff record?')){put(get().filter(x=>x.id!==id));render()}}function resetForm(){['id','name','designation','employeeId','mobile','joiningDate','role','accessPin','staffPhoto'].forEach(k=>document.getElementById(k).value='');document.getElementById('status').value='Active';document.getElementById('photoPreview').style.display='none';document.getElementById('photoPreview').src='';document.getElementById('photoPreview').dataset.value=''}function previewPhoto(e){let f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Please select an image file.');e.target.value='';return}if(f.size>5*1024*1024){alert('Please choose a photo smaller than 5 MB.');e.target.value='';return}let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=600,scale=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let data=c.toDataURL('image/jpeg',.72);let img=document.getElementById('photoPreview');img.src=data;img.dataset.value=data;img.style.display='block'};im.src=r.result};r.readAsDataURL(f)}function render(){let q=document.getElementById('q').value.toLowerCase(),a=get().filter(s=>JSON.stringify(s).toLowerCase().includes(q));document.getElementById('rows').innerHTML=a.map(s=>`<tr><td>${s.photo?`<img src="${esc(s.photo)}" style="width:48px;height:48px;object-fit:cover;border-radius:8px">`:'—'}</td><td>${esc(s.name)}</td><td>${esc(s.employeeId||'')}</td><td>${esc(s.designation||'')}</td><td>${esc(s.role||'')}</td><td>${esc(s.mobile||'')}</td><td><span class="tag">${esc(s.accessRole||'Staff')}</span></td><td><span class="tag">${esc(s.status)}</span></td><td><button class="btn secondary" onclick="editStaff('${esc(s.id)}')">Edit</button> <button class="btn danger" onclick="delStaff('${esc(s.id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No staff records.</td></tr>'}document.getElementById('q').addEventListener('input',render);render();</script></body></html>
