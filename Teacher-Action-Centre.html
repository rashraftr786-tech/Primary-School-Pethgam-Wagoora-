<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Action Centre</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<style>body{font-family:Arial;margin:0;background:#eef3f8;color:#18344f}main{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.row{border:1px solid #d8e2eb;border-radius:10px;padding:12px;margin:8px 0}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;background:#e8f0f7}.primary{background:#1769aa;color:#fff}.muted{color:#6b7d8f;font-size:13px}</style></head><body><main><a href="Teacher-Dashboard.html">← Teacher Dashboard</a><div class="card"><h1>Teacher Action Centre</h1><p class="muted">Student applications assigned to you, plus your own leave and certificate applications.</p></div><div class="card"><h2>Student Leave Requests</h2><div id="leaves"></div></div><div class="card"><h2>Student Certificate Requests</h2><div id="certs"></div></div><div class="card"><h2>My Applications</h2><div id="mine"></div></div></main>
<script>
const CONFIG=window.firebaseConfig||window.FIREBASE_CONFIG||(typeof firebaseConfig!=='undefined'?firebaseConfig:null);let auth,db,uid,sid;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function init(){if(!firebase.apps.length)firebase.initializeApp(CONFIG);auth=firebase.auth();db=firebase.firestore();uid=auth.currentUser?.uid;sid=sessionStorage.getItem('staffId');if(!uid||!sid){location.href='Role-Login.html';return false}const s=await db.collection('staff').doc(sid).get();if(!s.exists||s.data().authUid!==uid||String(s.data().accessRole||'').toUpperCase()!=='TEACHER'){location.href='Role-Login.html';return false}return true}
async function audit(module,action,id,remarks){await db.collection('auditHistory').add({actingUid:uid,module,action,documentId:id,remarks:remarks||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()})}
async function notify(to,title,message,type,id){if(!to)return;await db.collection('notifications').add({recipientUid:to,title,message,type,relatedCollection:type,relatedDocumentId:id,read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}
async function load(){const a=await db.collection('studentLeaves').where('assignedTeacherUids','array-contains',uid).get();$('leaves').innerHTML=a.docs.map(d=>{const x=d.data();return `<div class="row"><b>${esc(x.studentName||x.admissionNo||x.studentRecordId)}</b><div>${esc(x.from||'')} → ${esc(x.to||'')}</div><div>${esc(x.reason||'')}</div><div>Teacher status: ${esc(x.teacherStatus||'Pending')} · HOI: ${esc(x.hoiStatus||'Pending')}</div><button class="btn primary" onclick="reviewLeave('${d.id}')">Review / Comment</button></div>`}).join('')||'<p class="muted">No assigned student leave requests.</p>';
const b=await db.collection('studentCertificateApplications').where('assignedTeacherUids','array-contains',uid).get();$('certs').innerHTML=b.docs.map(d=>{const x=d.data();return `<div class="row"><b>${esc(x.studentName||x.admissionNo||x.studentRecordId)}</b><div>${esc(x.certificateType||'Certificate')} — ${esc(x.purpose||'')}</div><div>Teacher status: ${esc(x.teacherStatus||'Pending')} · HOI: ${esc(x.hoiStatus||'Pending')}</div><button class="btn primary" onclick="reviewCert('${d.id}')">Review / Comment</button></div>`}).join('')||'<p class="muted">No assigned certificate requests.</p>';
const c=await db.collection('staffLeaves').where('staffId','==',sid).get();const d=await db.collection('workBehaviourApplications').where('staffId','==',sid).get();const rows=[...c.docs.map(x=>({kind:'Leave',...x.data()})),...d.docs.map(x=>({kind:'Certificate',...x.data()}))];$('mine').innerHTML=rows.map(x=>`<div class="row"><b>${esc(x.kind)}</b> — ${esc(x.decision||x.status||'Pending')}<div>${esc(x.reason||x.purpose||'')}</div></div>`).join('')||'<p class="muted">No applications.</p>'}
async function reviewLeave(id){const ref=db.collection('studentLeaves').doc(id),s=await ref.get(),x=s.data()||{},remarks=prompt('Teacher remarks','')||'';await ref.update({teacherStatus:'Reviewed',teacherRemarks:remarks,teacherActedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await audit('studentLeaves','Teacher Review',id,remarks);await notify(x.studentUid,'Teacher reviewed your leave','Your leave request was reviewed by your teacher.','studentLeaves',id);await load()}
async function reviewCert(id){const ref=db.collection('studentCertificateApplications').doc(id),s=await ref.get(),x=s.data()||{},remarks=prompt('Teacher remarks','')||'';await ref.update({teacherStatus:'Reviewed',teacherRemarks:remarks,teacherActedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await audit('studentCertificateApplications','Teacher Review',id,remarks);await notify(x.studentUid,'Teacher reviewed your certificate request','Your certificate request was reviewed by your teacher.','studentCertificateApplications',id);await load()}
init().then(ok=>ok&&load());
</script></body></html>
