<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Profile | GPS Pethgam Wagoora</title>
<style>
:root{--blue:#0b5cab;--dark:#08376d;--bg:#f3f6fa;--line:#d8e0ea;--text:#17212b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.top{background:linear-gradient(135deg,var(--blue),var(--dark));color:#fff;padding:18px;text-align:center}.top img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}.top h1{margin:8px 0 3px;font-size:22px}.top p{margin:0;font-size:12px}.wrap{max-width:1050px;margin:18px auto;padding:0 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.light{background:#fff;color:var(--blue);border:1px solid #cbdced}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px #18324a0b;margin-bottom:15px;overflow:hidden}.hero{display:flex;gap:20px;align-items:center;padding:20px}.photo{width:120px;height:145px;object-fit:cover;border:1px solid #aaa;background:#f6f6f6}.avatar{width:120px;height:145px;display:flex;align-items:center;justify-content:center;border:1px dashed #999;color:#777;text-align:center}.hero h2{margin:0 0 7px;font-size:25px}.pill{display:inline-block;background:#eaf2fb;color:#174d80;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:700;margin:3px}.section{padding:16px}.section h3{margin:0 0 12px;color:var(--dark);font-size:17px;border-bottom:1px solid var(--line);padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{padding:10px;background:#f8fbff;border:1px solid #e5edf6;border-radius:9px}.label{font-size:11px;color:#657484;font-weight:700}.value{font-size:14px;margin-top:3px;word-break:break-word}.empty{text-align:center;padding:50px;color:#657484}@media(max-width:700px){.hero{align-items:flex-start}.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.hero{flex-direction:column}.grid{grid-template-columns:1fr}.hero h2{font-size:21px}}@media print{.top{background:#fff;color:#000}.bar{display:none}.card{box-shadow:none}.wrap{margin:0}}
</style></head><body>
<header class="top"><img src="new-logo.png" onerror="this.style.display='none'"><h1>Government Primary School Pethgam Wagoora</h1><p>Student Master Profile • Zone Wagoora • District Baramulla</p></header>
<main class="wrap"><div class="bar"><button class="btn light" onclick="history.back()">← Back</button><button class="btn primary" onclick="window.print()">Print Profile</button><button class="btn light" onclick="location.href='general_admission_register.html'">Open Register</button></div><div id="app"></div></main>
<script>
const KEY="GPSPETHGAM_MASTER_ADMISSION_V1"; const id=new URLSearchParams(location.search).get("id");
const records=JSON.parse(localStorage.getItem(KEY)||"[]"); const r=records.find(x=>x.id===id);
const full=(p)=>[r?.[p+"First"],r?.[p+"Middle"],r?.[p+"Last"]].filter(Boolean).join(" ")||"—";
const v=x=>x||"—"; const mask=x=>x&&x.length>=4?"XXXX XXXX "+x.slice(-4):v(x);
function item(label,value){return `<div class="item"><div class="label">${label}</div><div class="value">${value}</div></div>`}
if(!r){document.getElementById("app").innerHTML='<div class="card empty">Student record not found.<br><br>Open the General Admission Register and select a student profile.</div>'}
else{const name=full("student"); document.title=name+" | Student Profile";document.getElementById("app").innerHTML=`
<div class="card hero">${r.photo?`<img class="photo" src="${r.photo}" alt="Student Photo">`:'<div class="avatar">STUDENT<br>PHOTOGRAPH</div>'}<div><h2>${name}</h2><span class="pill">Student ID: ${v(r.studentId)}</span><span class="pill">Admission No.: ${v(r.admissionNo)}</span><span class="pill">Class: ${v(r.classJoining)}</span><span class="pill">Status: ${v(r.status)}</span></div></div>
<div class="card section"><h3>Personal Information</h3><div class="grid">${item("Gender",v(r.gender))}${item("Date of Birth",v(r.dob))}${item("DOB in Words",v(r.dobWords))}${item("PEN Number",v(r.penNumber))}${item("Aadhaar",mask(r.aadhaarNumber))}${item("Category",v(r.category))}${item("Blood Group",v(r.bloodGroup))}${item("Ration Card No.",v(r.rationNumber))}${item("Ration Card Type",v(r.rationType))}</div></div>
<div class="card section"><h3>Parents & Contact</h3><div class="grid">${item("Father",full("father"))}${item("Mother",full("mother"))}${item("Father Contact",v(r.fatherContact))}${item("Mother Contact",v(r.motherContact))}${item("Residence",v(r.residence))}${item("Tehsil",v(r.tehsil))}${item("District",v(r.district))}</div></div>
<div class="card section"><h3>Bank Information</h3><div class="grid">${item("Bank Account",v(r.bankAccount))}${item("Bank Name",v(r.bankName))}${item("Branch",v(r.bankBranch))}${item("IFSC",v(r.ifsc))}</div></div>
<div class="card section"><h3>Record History</h3><div class="grid">${item("Admission Date",v(r.admissionDate))}${item("Created",v(r.createdAt))}${item("Last Updated",v(r.updatedAt))}</div></div>`}
</script></body></html>
