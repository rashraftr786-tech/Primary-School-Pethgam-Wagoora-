<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS Pethgam Wagoora — Functional Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;background:#fff;border-right:1px solid #e2e8f0;padding:18px 12px}.brand{font-weight:800;font-size:15px;padding:10px 12px 18px}.nav{display:block;padding:10px 12px;border-radius:10px;color:#475569;text-decoration:none;font-weight:700;margin:3px 0;cursor:pointer}.nav.active,.nav:hover{background:#e0f2fe;color:#075985}.main{flex:1;padding:24px;max-width:1200px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.pill{background:#ecfdf5;color:#047857;padding:6px 10px;border-radius:999px;font-weight:700;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;box-shadow:0 3px 12px rgba(15,23,42,.04)}.value{font-size:27px;font-weight:800;margin-top:7px}.muted{color:#64748b}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.btn{border:1px solid #cbd5e1;background:#fff;padding:11px 13px;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#0369a1;color:#fff;border-color:#0369a1}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-top:1px solid #e2e8f0}th{background:#f8fafc;color:#475569}.status{padding:5px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.toggle{cursor:pointer}.modal{position:fixed;inset:0;background:#0f172a66;display:flex;align-items:center;justify-content:center;padding:15px}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(600px,100%)}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin-top:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:850px){.side{display:none}.main{padding:16px}.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🏫 GPS PETHGAM WAGOORA<br><span class="muted">School Administration</span></div><div id="nav"></div></aside><main class="main"><div class="top"><div><div class="muted">Academic Session 2026–27</div><h1 id="title" style="margin:5px 0">Dashboard</h1></div><span class="pill">● Demo / Local</span></div><div id="content"></div></main></div><div id="modal"></div><script>
const students=[{id:1,a:'101',n:'Aayat',p:'Mohammad Yousuf',c:'Grade 4',g:'Female',st:'active'},{id:2,a:'102',n:'Zahid',p:'Abdul Rashid',c:'Grade 4',g:'Male',st:'active'},{id:3,a:'103',n:'Junaid',p:'Ghulam Nabi',c:'Grade 4',g:'Male',st:'active'},{id:4,a:'104',n:'Inaya',p:'Farooq Ahmad',c:'Grade 3',g:'Female',st:'active'},{id:5,a:'105',n:'Rayan',p:'Mushtaq Ahmad',c:'Grade 5',g:'Male',st:'active'}];
let attendance={1:'present',2:'present',3:'absent',4:'present',5:'present'};let collections=[{n:'Excursion 2026',e:500,c:400},{n:'Examination',e:0,c:0}];
const pages=['Dashboard','Students','Attendance','Assessment','MDM','Collections','Staff','Certificates','Registers','Reports','Settings'];const icons=['🏠','👨‍🎓','📅','📝','🍚','💰','👩‍🏫','📄','📚','📊','⚙️'];
function nav(){document.getElementById('nav').innerHTML=pages.map((p,i)=>`<div class="nav ${i===0?'active':''}" onclick="go('${p}')">${icons[i]} ${p}</div>`).join('')}
function go(page){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.textContent.trim().endsWith(page)));document.getElementById('title').textContent=page;({Dashboard:dashboard,Students:studentsPage,Attendance:attendancePage,Assessment:assessment,MDM:mdm,Collections:collectionsPage,Staff:staff,Certificates:certificates,Registers:registers,Reports:reports,Settings:settings}[page])()}
function dashboard(){let pres=Object.values(attendance).filter(x=>x==='present').length;let col=collections.reduce((n,x)=>n+x.c,0);document.getElementById('content').innerHTML=`<div class="grid"><div class="card">👨‍🎓<div class="muted">Students</div><div class="value">${students.length}</div></div><div class="card">📅<div class="muted">Today's Attendance</div><div class="value">${pres}/${students.length}</div></div><div class="card">💰<div class="muted">Collected</div><div class="value">₹${col}</div></div><div class="card">📝<div class="muted">Assessments</div><div class="value">FA1–FA6</div></div></div><div class="card section"><h2>Quick Actions</h2><div class="actions"><button class="btn" onclick="go('Students')">➕ Add Student</button><button class="btn" onclick="go('Attendance')">📅 Mark Attendance</button><button class="btn" onclick="go('Assessment')">📝 Enter Marks</button><button class="btn" onclick="go('MDM')">🍚 Record MDM</button><button class="btn" onclick="go('Collections')">💰 New Collection</button><button class="btn" onclick="go('Certificates')">📄 Certificate</button></div></div>`}
function studentsPage(){document.getElementById('content').innerHTML=`<div class="card"><div style="display:flex;gap:10px;margin-bottom:12px"><input id="sq" placeholder="Search name, admission no. or class" oninput="renderStudents()"><button class="btn primary" onclick="addStudent()">＋ Add Student</button></div><div style="overflow:auto"><table><thead><tr><th>Admission</th><th>Student</th><th>Parent</th><th>Class</th><th>Gender</th><th>Status</th><th></th></tr></thead><tbody id="stbody"></tbody></table></div></div>`;renderStudents()}
function renderStudents(){let q=(document.getElementById('sq')?.value||'').toLowerCase();document.getElementById('stbody').innerHTML=students.filter(s=>(s.n+s.a+s.p+s.c).toLowerCase().includes(q)).map(s=>`<tr><td>${s.a}</td><td><b>${s.n}</b></td><td>${s.p}</td><td>${s.c}</td><td>${s.g}</td><td><span class="status">${s.st}</span></td><td><button class="btn" onclick="editStudent(${s.id})">Edit</button></td></tr>`).join('')}
function addStudent(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox"><h2>Add Student</h2><div class="formgrid"><label>Name<input id="fn"></label><label>Admission No.<input id="fa"></label><label>Father's Name<input id="fp"></label><label>Class<select id="fc"><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option></select></label></div><div style="text-align:right;margin-top:15px"><button class="btn" onclick="closeM()">Cancel</button> <button class="btn primary" onclick="saveStudent()">Save Student</button></div></div></div>`}
function saveStudent(){let s={id:Date.now(),a:document.getElementById('fa').value,n:document.getElementById('fn').value,p:document.getElementById('fp').value,c:document.getElementById('fc').value,g:'Male',st:'active'};if(!s.n||!s.a)return alert('Name and admission number are required.');students.push(s);closeM();studentsPage()}
function editStudent(id){let s=students.find(x=>x.id===id);alert(`Student Profile\n\n${s.n}\nAdmission: ${s.a}\nClass: ${s.c}\nParent: ${s.p}\n\nPromotion can move this student to the next session without re-entry.`)}
function closeM(){document.getElementById('modal').innerHTML=''}
function attendancePage(){document.getElementById('content').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:end;margin-bottom:12px"><label style="flex:1">Date<input type="date" value="2026-08-31"></label><div class="card" style="padding:10px">Present <b>${Object.values(attendance).filter(x=>x==='present').length}/${students.length}</b></div><button class="btn primary" onclick="alert('Attendance saved successfully.')">💾 Save</button></div><table><thead><tr><th>Roll</th><th>Student</th><th>Class</th><th>Status</th></tr></thead><tbody>${students.map((s,i)=>`<tr><td>${i+1}</td><td><b>${s.n}</b></td><td>${s.c}</td><td><button class="btn toggle" onclick="attendance[${s.id}]=attendance[${s.id}]==='present'?'absent':'present';attendancePage()">${attendance[s.id]==='present'?'✅ Present':'❌ Absent'}</button></td></tr>`).join('')}</tbody></table></div>`}
function assessment(){document.getElementById('content').innerHTML=`<div class="card"><h2>Assessment Calculator</h2><div class="formgrid"><label>FA Total<input id="fa1" type="number" value="20" oninput="calc()"></label><label>CCA<input id="cca" type="number" value="10" oninput="calc()"></label><label>SA<input id="sa" type="number" value="50" oninput="calc()"></label></div><div class="card section" style="background:#f0f9ff"><div class="muted">Grand Total</div><div class="value" id="total">80</div>FA Total + CCA + SA</div></div>`}
function calc(){let t=+fa1.value+(+cca.value)+(+sa.value);document.getElementById('total').textContent=t}
function mdm(){document.getElementById('content').innerHTML=`<div class="card"><h2>MDM Daily Record</h2><div class="formgrid"><label>Opening Rice (kg)<input id="op" type="number" value="42" oninput="mdmcalc()"></label><label>Received (kg)<input id="rec" type="number" value="10" oninput="mdmcalc()"></label><label>Consumed (kg)<input id="con" type="number" value="8" oninput="mdmcalc()"></label><label>Meals<input id="meals" type="number" value="5" oninput="mdmcalc()"></label><label>Rate per meal (₹)<input id="rate" type="number" value="4.45" step=".01" oninput="mdmcalc()"></label></div><div class="grid section"><div class="card">Closing Rice<div class="value" id="closing">44</div></div><div class="card">Expenditure<div class="value" id="expenditure">₹22.25</div></div></div><button class="btn primary section" onclick="alert('MDM record saved.')">💾 Save Record</button></div>`}
function mdmcalc(){closing.textContent=(+op.value+ +rec.value- +con.value).toFixed(2)+' kg';expenditure.textContent='₹'+((+meals.value)*(+rate.value)).toFixed(2)}
function collectionsPage(){let e=collections.reduce((n,x)=>n+x.e,0),c=collections.reduce((n,x)=>n+x.c,0);document.getElementById('content').innerHTML=`<div class="grid"><div class="card">Expected<div class="value">₹${e}</div></div><div class="card">Collected<div class="value">₹${c}</div></div><div class="card">Pending<div class="value">₹${Math.max(e-c,0)}</div></div><div class="card">Type<div class="value">Temporary</div></div></div><div class="card section"><h2>Collections</h2><table><thead><tr><th>Name</th><th>Expected</th><th>Collected</th><th>Pending</th></tr></thead><tbody>${collections.map(x=>`<tr><td><b>${x.n}</b></td><td>₹${x.e}</td><td>₹${x.c}</td><td>₹${x.e-x.c}</td></tr>`).join('')}</tbody></table><button class="btn primary section" onclick="alert('New collection form opened in the full application.')">＋ New Collection</button></div>`}
function staff(){document.getElementById('content').innerHTML=`<div class="card"><h2>Staff Register</h2><table><thead><tr><th>Name</th><th>Designation</th><th>Role</th><th>Status</th></tr></thead><tbody><tr><td><b>Mohammad Ashraf Rather</b></td><td>Teacher</td><td>English, Maths, EVS, Urdu, Kashmiri</td><td><span class="status">Active</span></td></tr></tbody></table></div>`}
function certificates(){document.getElementById('content').innerHTML=`<div class="card"><h2>Certificate Generator</h2><div class="formgrid"><label>Student<select id="cs">${students.map(s=>`<option>${s.n} — ${s.a}</option>`).join('')}</select></label><label>Type<select><option>Bonafide Certificate</option><option>DOB Certificate</option><option>Study Certificate</option><option>Character Certificate</option></select></label></div><button class="btn primary section" onclick="window.print()">🖨 Print / Save PDF</button></div><div class="card section"><div style="text-align:center;border-bottom:1px solid #e2e8f0;padding-bottom:15px"><b>Government Primary School Pethgam Wagoora</b><div class="muted">Pethgam Wagoora, Jammu & Kashmir</div><h2 style="margin-top:30px">BONAFIDE CERTIFICATE</h2></div><p style="line-height:2;margin-top:30px">This is to certify that <b id="certname">${students[0].n}</b>, Admission No. <b>${students[0].a}</b>, is/was a student of this school.</p></div>`}
function registers(){document.getElementById('content').innerHTML=`<div class="grid">${['Admission Register','Attendance Register','Examination Register','MDM Register','Stock Register','Library Register'].map(x=>`<div class="card"><b>📚 ${x}</b><p class="muted">View, filter and print register</p><button class="btn" onclick="alert('${x} opened')">Open →</button></div>`).join('')}</div>`}
function reports(){let p=Object.values(attendance).filter(x=>x==='present').length;document.getElementById('content').innerHTML=`<div class="grid"><div class="card">Students<div class="value">${students.length}</div></div><div class="card">Attendance<div class="value">${Math.round(p/students.length*100)}%</div></div><div class="card">Reports<div class="value">9</div></div><div class="card">Export<div class="value">CSV</div><button class="btn" onclick="exportCSV()">Download</button></div></div>`}
function exportCSV(){let csv='Admission,Student,Father,Class,Gender,Status\n'+students.map(s=>`${s.a},${s.n},${s.p},${s.c},${s.g},${s.st}`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='students.csv';a.click()}
function settings(){document.getElementById('content').innerHTML=`<div class="card"><h2>School Settings</h2><div class="formgrid"><label>School Name<input value="Government Primary School Pethgam Wagoora"></label><label>Academic Session<input value="2026-27"></label><label>District<input value="Baramulla"></label><label>Zone<input value="Wagoora"></label><label>UDISE Code<input></label><label>Head of Institution<input></label></div><button class="btn primary section" onclick="alert('Settings saved in demo mode.')">💾 Save Settings</button></div>`}
nav();dashboard();
</script></body></html>
