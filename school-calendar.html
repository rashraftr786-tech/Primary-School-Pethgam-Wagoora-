<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>School Calendar & Holidays - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>School Calendar & Holidays</h1><p>Maintain holidays, working days, events and important school dates.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Event Type</label><select id="type"><option>Holiday</option><option>School Event</option><option>Examination</option><option>Meeting</option><option>Working Day</option></select></div><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Session</label><input id="session" value="2026-2027"></div></div><div class="field"><label>Notes</label><textarea id="notes"></textarea></div><div class="actions"><button class="btn ok" onclick="saveEvent()">Save Date</button><button class="btn secondary" onclick="clearForm()">Clear</button></div></section><section class="card"><div class="grid"><div class="field"><label>Search</label><input id="q" oninput="render()"></div><div class="field"><label>Filter Type</label><select id="filter" onchange="render()"><option>All</option><option>Holiday</option><option>School Event</option><option>Examination</option><option>Meeting</option><option>Working Day</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Title</th><th>Session</th><th>Notes</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const KEY='GPSPETHGAM_SCHOOL_CALENDAR_V1';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function clearForm(){date.value='';title.value='';notes.value=''}function saveEvent(){if(!date.value||!title.value)return alert('Enter date and title.');let a=data();a.push({id:crypto.randomUUID(),date:date.value,type:type.value,title:title.value,session:session.value,notes:notes.value});save(a);clearForm();render()}function del(id){save(data().filter(x=>x.id!==id));render()}function render(){let q=(document.getElementById('q').value||'').toLowerCase(),f=filter.value,a=data().filter(x=>(f==='All'||x.type===f)&&JSON.stringify(x).toLowerCase().includes(q)).sort((x,y)=>x.date.localeCompare(y.date));rows.innerHTML=a.map(x=>`<tr><td>${x.date}</td><td><span class="pill">${x.type}</span></td><td><b>${x.title}</b></td><td>${x.session}</td><td>${x.notes||'—'}</td><td><button class="btn danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No calendar entries.</td></tr>'}render();
</script></body></html>
