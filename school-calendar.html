<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>School Calendar & Holidays - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="firebase-sync.js"></script></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>School Calendar & Holidays</h1><p>Maintain holidays, working days, events and important school dates.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Event Type</label><select id="type"><option>Holiday</option><option>School Event</option><option>Examination</option><option>Meeting</option><option>Working Day</option></select></div><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Session</label><input id="session" value="2026-2027"></div></div><div class="field"><label>Notes</label><textarea id="notes"></textarea></div><div class="actions"><button class="btn ok" onclick="saveEvent()">Save Date</button><button class="btn secondary" onclick="clearForm()">Clear</button></div></section><section class="card"><div class="grid"><div class="field"><label>Search</label><input id="q" oninput="render()"></div><div class="field"><label>Filter Type</label><select id="filter" onchange="render()"><option>All</option><option>Holiday</option><option>School Event</option><option>Examination</option><option>Meeting</option><option>Working Day</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Title</th><th>Session</th><th>Notes</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const KEY='GPSPETHGAM_SCHOOL_CALENDAR_V1';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}async function save(a){localStorage.setItem(KEY,JSON.stringify(a));await syncCalendar(a)}
async function syncCalendar(a){if(!GPSCloud.init()||!GPSCloud.db||!GPSCloud.signedIn())throw new Error('Firebase authentication is required to save calendar entries.');const b=GPSCloud.db.batch();a.slice(0,450).forEach(x=>b.set(GPSCloud.db.collection('calendar').doc(String(x.id)),{...x,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}));await b.commit()}
async function loadCloudCalendar(){if(!GPSCloud.init()||!GPSCloud.db||!GPSCloud.signedIn())return;try{const snap=await GPSCloud.db.collection('calendar').get();const cloud=snap.docs.map(d=>({id:d.id,...d.data()}));localStorage.setItem(KEY,JSON.stringify(cloud));render()}catch(e){console.warn('Cloud calendar:',e)}}
function clearForm(){date.value='';title.value='';notes.value=''}async function saveEvent(){if(!date.value||!title.value)return alert('Enter date and title.');let a=data();const item={id:crypto.randomUUID(),date:date.value,type:type.value,title:title.value,session:session.value,notes:notes.value};a.push(item);try{await syncCalendar([item]);localStorage.setItem(KEY,JSON.stringify(a));clearForm();await loadCloudCalendar()}catch(e){alert('Calendar entry was not saved to Firebase: '+e.message)}}async function del(id){if(!GPSCloud.init()||!GPSCloud.db||!GPSCloud.signedIn())return alert('Administrator Firebase sign-in is required.');try{await GPSCloud.db.collection('calendar').doc(String(id)).delete();await loadCloudCalendar()}catch(e){alert('Delete failed: '+e.message)}}function render(){let q=(document.getElementById('q').value||'').toLowerCase(),f=filter.value,a=data().filter(x=>(f==='All'||x.type===f)&&JSON.stringify(x).toLowerCase().includes(q)).sort((x,y)=>x.date.localeCompare(y.date));rows.innerHTML=a.map(x=>`<tr><td>${x.date}</td><td><span class="pill">${x.type}</span></td><td><b>${x.title}</b></td><td>${x.session}</td><td>${x.notes||'—'}</td><td><button class="btn danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No calendar entries.</td></tr>'}render();loadCloudCalendar();
</script></body></html>
