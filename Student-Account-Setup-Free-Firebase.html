<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Account Setup</title><style>body{font-family:system-ui;background:#f4f8fb;color:#153047;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dce6ef;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}input{width:100%;padding:10px;border:1px solid #cbd8e3;border-radius:9px;box-sizing:border-box}button{padding:11px 15px;border:0;border-radius:9px;font-weight:800;cursor:pointer;background:#0b5cab;color:white}.muted{color:#66788a;font-size:13px}.ok{background:#e6f6ed;padding:10px;border-radius:9px}.err{background:#fee8e7;padding:10px;border-radius:9px}</style></head><body><main class="wrap"><h1>Student Account Setup</h1><p class="muted">HOI/Admin only. Creates Firebase Authentication accounts and the matching Firestore student profile. Passwords are never stored in Firestore.</p><div id="state" class="card">Checking administrator access…</div><div id="formCard" class="card" style="display:none"><div class="grid"><div><label>Student ID</label><input id="studentId"></div><div><label>Admission Number</label><input id="admissionNo"></div><div><label>Full Name</label><input id="name"></div><div><label>Class</label><input id="classJoining"></div><div><label>Date of Birth</label><input id="dob" type="date"></div><div><label>Gender</label><input id="gender"></div></div><p><label>Profile Photo (optional)</label><input id="photo" type="file" accept="image/*"></p><button id="create">Create / Activate Student Account</button><div id="result" style="margin-top:12px"></div></div></main><script src="firebase-config.js"></script><script type="module">
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const cfg=window.GPS_FIREBASE_CONFIG,app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let adminOk=false;
function emailFor(id){return`student-${String(id).trim().toLowerCase().replace(/[^a-z0-9._-]/g,'-')}@student.pethgam.local`}
async function init(){const state=$('state');const email=prompt('Enter the Firebase Admin email:');if(!email)return state.textContent='Cancelled.';const pw=prompt('Enter the Admin password:');if(!pw)return state.textContent='Cancelled.';try{const c=await signInWithEmailAndPassword(auth,email,pw);const a=await getDoc(doc(db,'admins',c.user.uid));if(!a.exists()||a.data().active!==true||a.data().role!=='admin')throw Error('This account is not an active school admin.');adminOk=true;state.innerHTML='<div class="ok">Administrator verified. Enter the student details below.</div>';$('formCard').style.display='block'}catch(e){state.innerHTML='<div class="err">'+e.message+'</div>'}}
async function cloudinary(file){const c=window.GPS_CLOUDINARY;if(!file||!c||c.cloudName.startsWith('REPLACE_')||c.uploadPreset.startsWith('REPLACE_'))return'';const fd=new FormData();fd.append('file',file);fd.append('upload_preset',c.uploadPreset);const r=await fetch(`https://api.cloudinary.com/v1_1/${c.cloudName}/image/upload`,{method:'POST',body:fd});if(!r.ok)throw Error('Photo upload failed');const j=await r.json();return j.secure_url||''}
$('create').onclick=async()=>{if(!adminOk)return;const result=$('result');result.textContent='Creating…';try{const sid=$('studentId').value.trim(),adm=$('admissionNo').value.trim(),name=$('name').value.trim();if(!sid||!adm||!name)throw Error('Student ID, Admission Number and Full Name are required.');const secondaryName='student-account-creator-'+Date.now();const secondary=initializeApp(cfg,secondaryName);const sa=getAuth(secondary);const temp=crypto.randomUUID().replace(/-/g,'').slice(0,12)+'Aa1!';const u=await createUserWithEmailAndPassword(sa,emailFor(sid),temp);const photo=await cloudinary($('photo').files[0]);await setDoc(doc(db,'students',u.user.uid),{studentId:sid,admissionNo:adm,name,classJoining:$('classJoining').value.trim(),dob:$('dob').value,gender:$('gender').value.trim(),photo,createdAt:serverTimestamp(),active:true},{merge:true});result.innerHTML='<div class="ok"><b>Account created.</b><br>Student ID: '+sid+'<br>Temporary password: <b>'+temp+'</b><br><small>Give this password to the student securely and ask them to change it after the first login.</small></div>'}catch(e){result.innerHTML='<div class="err">'+e.message+'</div>'}};init();
</script></body></html>
