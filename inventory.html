<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Inventory / Stock Register - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>Inventory / Stock Register</h1><p>Track school supplies, assets, quantities and stock movement.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>Item Code</label><input id="code" placeholder="STK-001"></div><div class="field"><label>Item Name</label><input id="name"></div><div class="field"><label>Category</label><input id="category" placeholder="Stationery / Furniture"></div><div class="field"><label>Unit</label><input id="unit" value="Nos."></div><div class="field"><label>Opening Quantity</label><input id="qty" type="number" min="0" value="0"></div><div class="field"><label>Minimum Level</label><input id="min" type="number" min="0" value="0"></div><div class="field"><label>Location</label><input id="location" placeholder="Store Room"></div><div class="field"><label>Remarks</label><input id="remarks"></div></div><div class="actions"><button class="btn ok" onclick="saveItem()">Save Item</button><button class="btn secondary" onclick="clearForm()">Clear</button><button class="btn light" onclick="exportCSV()">Export CSV</button></div></section><section class="card"><div class="grid"><div class="field"><label>Search</label><input id="q" oninput="render()"></div><div class="field"><label>Stock Movement Item</label><select id="moveItem"></select></div><div class="field"><label>Movement</label><select id="moveType"><option>Receipt</option><option>Issue</option></select></div><div class="field"><label>Quantity</label><input id="moveQty" type="number" min="1" value="1"></div></div><div class="actions"><button class="btn" onclick="moveStock()">Record Movement</button></div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Code</th><th>Item</th><th>Category</th><th>Unit</th><th>Balance</th><th>Min</th><th>Location</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const KEY='GPSPETHGAM_INVENTORY_V1';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function clearForm(){['code','name','category','qty','min','location','remarks'].forEach(x=>document.getElementById(x).value='');unit.value='Nos.'}function saveItem(){let a=data(),nameV=name.value.trim();if(!nameV)return alert('Enter item name.');a.push({id:crypto.randomUUID(),code:code.value||('STK-'+String(a.length+1).padStart(3,'0')),name:nameV,category:category.value,unit:unit.value,qty:Number(qty.value||0),min:Number(min.value||0),location:location.value,remarks:remarks.value,updatedAt:new Date().toISOString()});save(a);clearForm();render()}function moveStock(){let id=moveItem.value,n=Number(moveQty.value||0),a=data(),x=a.find(z=>z.id===id);if(!x||n<=0)return alert('Select item and quantity.');if(moveType.value==='Issue'&&n>x.qty)return alert('Issue quantity exceeds available balance.');x.qty+=moveType.value==='Receipt'?n:-n;x.updatedAt=new Date().toISOString();save(a);render()}function del(id){save(data().filter(x=>x.id!==id));render()}function render(){let q=(document.getElementById('q').value||'').toLowerCase(),a=data().filter(x=>JSON.stringify(x).toLowerCase().includes(q));moveItem.innerHTML=a.map(x=>`<option value="${x.id}">${x.code} — ${x.name}</option>`).join('')||'<option value="">No items</option>';rows.innerHTML=a.map(x=>`<tr><td>${x.code}</td><td><b>${x.name}</b></td><td>${x.category||'—'}</td><td>${x.unit}</td><td>${x.qty}</td><td>${x.min}</td><td>${x.location||'—'}</td><td><span class="pill ${x.qty<=x.min?'danger':'ok'}">${x.qty<=x.min?'Low Stock':'OK'}</span></td><td><button class="btn danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="9">No stock items.</td></tr>'}function exportCSV(){let a=data(),csv='Code,Item,Category,Unit,Quantity,Minimum,Location,Remarks\n'+a.map(x=>[x.code,x.name,x.category,x.unit,x.qty,x.min,x.location,x.remarks].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n'),b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='inventory-register.csv';x.click();URL.revokeObjectURL(u)}render();
</script></body></html>
