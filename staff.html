<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Staff & Teacher Management - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>Staff & Teacher Management</h1><p>Maintain the school staff master record used by attendance and leave.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>Staff ID</label><input id="sid" placeholder="STAFF-001"></div><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Designation</label><input id="designation" placeholder="Teacher / Head Teacher"></div><div class="field"><label>Department / Subject</label><input id="subject"></div><div class="field"><label>Mobile</label><input id="mobile"></div><div class="field"><label>Date of Joining</label><input id="join" type="date"></div><div class="field"><label>Status</label><select id="status"><option>Active</option><option>On Leave</option><option>Inactive</option></select></div><div class="field"><label>Employee Code</label><input id="ecode"></div></div><div class="actions"><button class="btn ok" onclick="saveStaff()">Save Staff</button><button class="btn secondary" onclick="clearForm()">Clear</button><button class="btn light" onclick="exportCSV()">Export CSV</button></div></section><section class="card"><div class="grid"><div class="field"><label>Search</label><input id="q" oninput="render()" placeholder="Name / ID / designation"></div></div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Staff ID</th><th>Name</th><th>Designation</th><th>Subject</th><th>Mobile</th><th>Joining</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const KEY='GPSPETHGAM_STAFF_MASTER_V1';let editId=null;function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function clearForm(){editId=null;['sid','name','designation','subject','mobile','join','ecode'].forEach(x=>document.getElementById(x).value='');status.value='Active'}function saveStaff(){let a=data(),id=sid.value.trim()||('STAFF-'+String(a.length+1).padStart(3,'0'));let rec={id:editId||crypto.randomUUID(),staffId:id,name:name.value.trim(),designation:designation.value.trim(),subject:subject.value.trim(),mobile:mobile.value.trim(),joiningDate:join.value,status:status.value,employeeCode:ecode.value.trim(),updatedAt:new Date().toISOString()};if(!rec.name)return alert('Enter staff name.');if(editId){let i=a.findIndex(x=>x.id===editId);a[i]=rec}else a.push(rec);save(a);clearForm();render()}function edit(id){let s=data().find(x=>x.id===id);if(!s)return;editId=id;sid.value=s.staffId||'';name.value=s.name||'';designation.value=s.designation||'';subject.value=s.subject||'';mobile.value=s.mobile||'';join.value=s.joiningDate||'';status.value=s.status||'Active';ecode.value=s.employeeCode||'';scrollTo(0,0)}function del(id){if(confirm('Delete this staff record?')){save(data().filter(x=>x.id!==id));render()}}function render(){let q=(document.getElementById('q').value||'').toLowerCase();let a=data().filter(s=>JSON.stringify(s).toLowerCase().includes(q));rows.innerHTML=a.map(s=>`<tr><td>${s.staffId}</td><td><b>${s.name}</b></td><td>${s.designation}</td><td>${s.subject||'—'}</td><td>${s.mobile||'—'}</td><td>${s.joiningDate||'—'}</td><td><span class="pill ${s.status==='Active'?'ok':s.status==='Inactive'?'danger':'warn'}">${s.status}</span></td><td><button class="btn light" onclick="edit('${s.id}')">Edit</button> <button class="btn danger" onclick="del('${s.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="8">No staff records.</td></tr>'}function exportCSV(){let a=data(),csv='Staff ID,Name,Designation,Subject,Mobile,Joining Date,Status,Employee Code\n'+a.map(s=>[s.staffId,s.name,s.designation,s.subject,s.mobile,s.joiningDate,s.status,s.employeeCode].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n');let b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='staff-register.csv';x.click();URL.revokeObjectURL(u)}render();
</script></body></html>
