<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Staff Attendance - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>Staff Attendance</h1><p>Daily attendance for teachers and school staff.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Session</label><input id="session" value="2026-2027"></div><div class="field"><label>Search</label><input id="q" oninput="render()" placeholder="Name / Staff ID"></div></div><div class="actions"><button class="btn light" onclick="setAll('Present')">All Present</button><button class="btn light" onclick="setAll('Absent')">All Absent</button><button class="btn ok" onclick="saveDay()">Save Attendance</button><button class="btn secondary" onclick="window.print()">Print</button></div></section><section class="card"><div class="statgrid"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="present">0</b><span>Present</span></div><div class="stat"><b id="absent">0</b><span>Absent</span></div><div class="stat"><b id="leave">0</b><span>Leave</span></div><div class="stat"><b id="nm">0</b><span>Not Marked</span></div></div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Staff ID</th><th>Name</th><th>Designation</th><th>Status</th><th>Remarks</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const SKEY='GPSPETHGAM_STAFF_MASTER_V1',AKEY='GPSPETHGAM_STAFF_ATTENDANCE_V1';let staff=[];date.value=new Date().toISOString().slice(0,10);function data(){try{return JSON.parse(localStorage.getItem(SKEY)||'[]')}catch{return[]}}function all(){try{return JSON.parse(localStorage.getItem(AKEY)||'{}')}catch{return{}}}function key(){return session.value+'|'+date.value}function render(){staff=data().filter(s=>s.status!=='Inactive');let q=(document.getElementById('q').value||'').toLowerCase();let rec=all()[key()]||{};let a=staff.filter(s=>JSON.stringify(s).toLowerCase().includes(q));rows.innerHTML=a.map(s=>{let r=rec[s.id]||{};return `<tr data-id="${s.id}"><td>${s.staffId}</td><td><b>${s.name}</b></td><td>${s.designation}</td><td><select class="att"><option ${r.status==='Present'?'selected':''}>Present</option><option ${r.status==='Absent'?'selected':''}>Absent</option><option ${r.status==='Leave'?'selected':''}>Leave</option><option ${!r.status||r.status==='Not Marked'?'selected':''}>Not Marked</option></select></td><td><input class="remark" value="${r.remarks||''}" placeholder="Remarks"></td></tr>`}).join('');stats()}function stats(){let v=[...document.querySelectorAll('.att')].map(x=>x.value);total.textContent=v.length;present.textContent=v.filter(x=>x==='Present').length;absent.textContent=v.filter(x=>x==='Absent').length;leave.textContent=v.filter(x=>x==='Leave').length;nm.textContent=v.filter(x=>x==='Not Marked').length}function setAll(v){document.querySelectorAll('.att').forEach(x=>x.value=v);stats()}function saveDay(){let a=all(),r={};document.querySelectorAll('tr[data-id]').forEach(tr=>r[tr.dataset.id]={status:tr.querySelector('.att').value,remarks:tr.querySelector('.remark').value});a[key()]=r;localStorage.setItem(AKEY,JSON.stringify(a));alert('Staff attendance saved.');stats()}document.addEventListener('change',e=>{if(e.target.classList.contains('att'))stats()});render();
</script></body></html>
