<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Promotion & Class Management - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>Student Promotion & Class Management</h1><p>Promote students safely while retaining class history.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>From Class</label><select id="from"></select></div><div class="field"><label>To Class</label><select id="to"></select></div><div class="field"><label>Academic Session</label><input id="session" value="2026-2027"></div><div class="field"><label>Search</label><input id="q" placeholder="Name / Admission No / Student ID"></div></div><div class="actions"><button class="btn light" onclick="load()">Load Students</button><button class="btn ok" onclick="promoteSelected()">Promote Selected</button><button class="btn secondary" onclick="selectAll(true)">Select All</button><button class="btn secondary" onclick="selectAll(false)">Clear</button></div></section>
<section class="card"><div class="statgrid"><div class="stat"><b id="count">0</b><span>Students Loaded</span></div><div class="stat"><b id="selected">0</b><span>Selected</span></div><div class="stat"><b id="promoted">0</b><span>Promoted This Session</span></div></div></section>
<section class="card"><div class="table-wrap"><table><thead><tr><th><input type="checkbox" onchange="selectAll(this.checked)"></th><th>Student ID</th><th>Admission No.</th><th>Name</th><th>Current Class</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const KEY='GPSPETHGAM_MASTER_ADMISSION_V1',HKEY='GPSPETHGAM_PROMOTION_V1';let students=[];const classes=['Pre-Primary','1','2','3','4','5'];
function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function hist(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]')}catch{return[]}}
function init(){from.innerHTML=classes.map(x=>`<option>${x}</option>`).join('');to.innerHTML=classes.map(x=>`<option>${x}</option>`).join('');from.value='5';to.value='';if(to.options.length)to.selectedIndex=Math.min(5,from.selectedIndex+1);load()}function load(){students=data().filter(s=>(s.status||'Pending')!=='Rejected');let f=from.value,q=(document.getElementById('q').value||'').toLowerCase();let arr=students.filter(s=>(!f||String(s.class||s.className||'')===f)&&(!q||JSON.stringify(s).toLowerCase().includes(q)));rows.innerHTML=arr.map(s=>`<tr><td><input class="sel" type="checkbox" data-id="${s.id||s.studentId}" onchange="stats()"></td><td>${s.studentId||'—'}</td><td>${s.admissionNo||'—'}</td><td><b>${s.studentName||s.name||'—'}</b></td><td>${s.class||s.className||'—'}</td><td><span class="pill">${s.status||'Pending'}</span></td></tr>`).join('')||'<tr><td colspan="6">No students found.</td></tr>';count.textContent=arr.length;stats()}
function selectAll(v){document.querySelectorAll('.sel').forEach(x=>x.checked=v);stats()}function stats(){selected.textContent=document.querySelectorAll('.sel:checked').length;promoted.textContent=hist().filter(x=>x.session===session.value).length}
function promoteSelected(){let ids=[...document.querySelectorAll('.sel:checked')].map(x=>x.dataset.id);if(!ids.length)return alert('Select at least one student.');if(!to.value)return alert('Choose the destination class.');let a=data(),h=hist(),sess=session.value;ids.forEach(id=>{let s=a.find(x=>String(x.id||x.studentId)===String(id));if(!s)return;let old=s.class||s.className||'';if(old===to.value)return;h.push({id:s.id,studentId:s.studentId,admissionNo:s.admissionNo,name:s.studentName||s.name,fromClass:old,toClass:to.value,session:sess,date:new Date().toISOString()});s.previousClass=old;s.class=to.value;s.className=to.value;s.updatedAt=new Date().toISOString()});save(a);localStorage.setItem(HKEY,JSON.stringify(h));alert(ids.length+' student(s) processed.');load()}
init();
</script></body></html>
