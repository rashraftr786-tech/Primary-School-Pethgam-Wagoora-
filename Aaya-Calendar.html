<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Calendar - Aaya View</title><style>:root{--b:#315ee8;--bg:#eef3f7;--line:#dfe6ee;--muted:#66758a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Arial;color:#172033}.top{background:linear-gradient(135deg,#315ee8,#4d46df);color:#fff;padding:18px}.toprow,.wrap{max-width:900px;margin:auto}.toprow{display:flex;justify-content:space-between;align-items:center}.wrap{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #2939520e}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}.item b{display:block}.item small{color:var(--muted)}.back{color:#315ee8;text-decoration:none;font-weight:800}.err{padding:12px;background:#fff1f0;color:#b4233c;border-radius:12px}.empty{color:var(--muted)}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}</style><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script></head><body><header class="top"><div class="toprow"><div><b>School Calendar</b><br><small>Government Primary School Pethgam Wagoora · Aaya View</small></div><button onclick="location.href='Aaya-Dashboard.html'">Back</button></div></header><main class="wrap"><div class="card"><b>View Only</b><p style="margin:6px 0;color:#66758a">Holidays, events and important dates are visible here. Aaya accounts cannot add, edit or delete calendar entries.</p></div><section id="content"><div class="card">Loading…</div></section></main><script>const CONFIG={apiKey:"AIzaSyADB32wJq886NNqMuJk5n1zO45oSi-bdLs",authDomain:"gps-pethgam-wagoora-portal.firebaseapp.com",projectId:"gps-pethgam-wagoora-portal",storageBucket:"gps-pethgam-wagoora-portal.firebasestorage.app",messagingSenderId:"243117067000",appId:"1:243117067000:web:a5320441bcbaed71e4490d",measurementId:"G-WMXPK3229Y"};const SESSION='GPSPETHGAM_COMMON_LOGIN_SESSION_V1',ALT='GPSPETHGAM_ROLE_SESSION_V1';let auth,db;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){if(!firebase.apps.length)firebase.initializeApp(CONFIG);auth=firebase.auth();db=firebase.firestore();const s=JSON.parse(sessionStorage.getItem(SESSION)||localStorage.getItem(SESSION)||sessionStorage.getItem(ALT)||localStorage.getItem(ALT)||'null');if(!s?.staffId||String(s.role).toUpperCase()!=='AAYA')throw Error('Aaya session not found. Please sign in through the Common Login.');if(!auth.currentUser)await new Promise((res,rej)=>{let u=auth.onAuthStateChanged(x=>{if(x){u();res(x)}});setTimeout(()=>{u();rej(Error('Firebase session could not be restored. Please sign in again.'))},8000)});const d=await db.collection('staff').doc(s.staffId).get();if(!d.exists)throw Error('Staff record not found.');const me=d.data()||{};if(me.authUid&&me.authUid!==auth.currentUser.uid)throw Error('Firebase account is not linked to this staff record.');if(me.status==='Inactive'||me.active===false||String(me.accessRole||'').toUpperCase()!=='AAYA')throw Error('Aaya access is not active for this account.');return me}function fail(e){$('content').innerHTML='<div class="err">'+esc(e.message||e)+'</div>'}async function run(){try{await boot();const q=await db.collection('calendar').get();const rows=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));$('content').innerHTML='<div class="card">'+(rows.map(x=>`<article class="item"><b>${esc(x.title||'School Event')}</b><small>${esc(x.date||'')} · ${esc(x.type||'')} · ${esc(x.session||'')}</small><div style="margin-top:7px">${esc(x.notes||'')}</div></article>`).join('')||'<p class="empty">No calendar entries available.</p>')+'</div>'}catch(e){fail(e)}}run();</script></body></html>
