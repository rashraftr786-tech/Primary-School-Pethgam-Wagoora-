<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Communication — GPS Pethgam Wagoora</title>
<link rel="stylesheet" href="module-common.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>.gate{max-width:520px;margin:60px auto}.msg{padding:10px;border-radius:9px;margin-top:10px}.ok{background:#ecfdf5;color:#166534}.err{background:#fef2f2;color:#991b1b}.list{display:grid;gap:10px}.message-card{border:1px solid #dbe4ef;border-radius:12px;padding:14px;background:#fff}.meta{font-size:12px;color:#64748b}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf3fc;color:#0b5cab;font-size:11px;font-weight:700}</style>
</head>
<body>
<header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>Student Communication</h1><p>Send targeted messages to individual students or whole classes.</p></div></div></header>
<main class="wrap">
<a class="back" href="index.html">← Back to Dashboard</a>
<div id="gate" class="card gate"><h2>🔐 Admin Sign In</h2><p class="muted">Only an active school administrator can send student communications.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn ok" id="loginBtn">Sign In</button></div><div id="loginMsg" class="msg err" style="display:none"></div></div>
<div id="app" style="display:none">
<section class="card"><h2>New Message</h2><div class="grid"><div class="field"><label>Recipient</label><select id="recipient"><option value="all">All Students</option><option value="class">Entire Class</option><option value="student">Individual Student</option></select></div><div class="field" id="classWrap" style="display:none"><label>Class</label><select id="classSelect"></select></div><div class="field" id="studentWrap" style="display:none"><label>Student</label><select id="studentSelect"></select></div><div class="field"><label>Priority</label><select id="priority"><option>Normal</option><option>Important</option><option>Urgent</option></select></div></div><div class="field"><label>Subject</label><input id="subject" maxlength="120"></div><div class="field"><label>Message</label><textarea id="message" maxlength="2000" placeholder="Write the message for the selected student(s)…"></textarea></div><div class="actions"><button class="btn ok" id="sendBtn">📨 Send Message</button><button class="btn secondary" id="clearBtn">Clear</button></div><div id="sendMsg" class="msg" style="display:none"></div></section>
<section class="card"><div class="topbar"><h2>Recent Communications</h2><button class="btn secondary" id="refreshBtn">Refresh</button></div><div id="messages" class="list"></div></section>
</div></main>
<script>
const $=id=>document.getElementById(id); let auth,db,students=[];
function show(el,text,ok){el.textContent=text;el.style.display='block';el.className='msg '+(ok?'ok':'err')}
async function init(){try{if(!firebase.apps.length)firebase.initializeApp(window.GPS_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async u=>{if(!u){$('gate').style.display='block';$('app').style.display='none';return}try{await verifyAdmin(u);$('gate').style.display='none';$('app').style.display='block';await loadStudents();await loadMessages()}catch(e){await auth.signOut();show($('loginMsg'),e.message||'Admin authorization failed.',false)}})}catch(e){show($('loginMsg'),'Firebase initialization failed: '+e.message,false)}}
async function verifyAdmin(u){const s=await db.collection('admins').doc(u.uid).get();if(!s.exists||s.data().role!=='admin'||s.data().active!==true)throw new Error('This account is not an active school administrator.')}
async function loadStudents(){const snap=await db.collection('students').get();students=snap.docs.map(d=>({id:d.id,...d.data()}));students.sort((a,b)=>nameOf(a).localeCompare(nameOf(b)));$('studentSelect').innerHTML=students.map(s=>'<option value="'+esc(s.id)+'">'+esc(nameOf(s))+' — '+esc(s.admissionNo||s.studentId||'')+'</option>').join('');const classes=[...new Set(students.map(s=>String(s.classJoining||s.class||s.presentClass||'').trim()).filter(Boolean))].sort();$('classSelect').innerHTML=classes.map(c=>'<option>'+esc(c)+'</option>').join('')}
function nameOf(s){return s.name||s.studentName||[s.studentFirst,s.studentMiddle,s.studentLast].filter(Boolean).join(' ')||'Student'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('recipient').onchange=()=>{const v=$('recipient').value;$('classWrap').style.display=v==='class'?'block':'none';$('studentWrap').style.display=v==='student'?'block':'none'};
$('clearBtn').onclick=()=>{['subject','message'].forEach(id=>$(id).value='');$('priority').value='Normal'};
$('sendBtn').onclick=async()=>{const type=$('recipient').value,subject=$('subject').value.trim(),message=$('message').value.trim();if(!subject||!message){show($('sendMsg'),'Enter both subject and message.',false);return}let targets=students;if(type==='class'){const c=$('classSelect').value;targets=students.filter(s=>String(s.classJoining||s.class||s.presentClass||'')===c)}if(type==='student')targets=students.filter(s=>s.id===$('studentSelect').value);if(!targets.length){show($('sendMsg'),'No recipient students found.',false);return}if(targets.length>450){show($('sendMsg'),'Please send to a smaller group. Batch limit is 450 students at a time.',false);return}$('sendBtn').disabled=true;try{const batch=db.batch();const now=new Date().toISOString();targets.forEach(s=>{const ref=db.collection('students').doc(s.id).collection('communications').doc();batch.set(ref,{subject,message,priority:$('priority').value,audience:type,studentRecordId:s.id,studentId:s.studentId||'',admissionNo:s.admissionNo||'',studentName:nameOf(s),sentAt:now,sentBy:auth.currentUser.email||auth.currentUser.uid,read:false})});await batch.commit();show($('sendMsg'),'Message sent to '+targets.length+' student(s).',true);$('subject').value='';$('message').value='';await loadMessages()}catch(e){console.error(e);show($('sendMsg'),'Send failed: '+e.message,false)}finally{$('sendBtn').disabled=false}};
async function loadMessages(){const box=$('messages');box.innerHTML='Loading…';const all=[];for(const s of students.slice(0,100)){try{const snap=await db.collection('students').doc(s.id).collection('communications').orderBy('sentAt','desc').limit(3).get();snap.forEach(d=>all.push({id:d.id,...d.data()}))}catch(e){}}all.sort((a,b)=>String(b.sentAt||'').localeCompare(String(a.sentAt||'')));box.innerHTML=all.slice(0,30).map(m=>'<div class="message-card"><span class="pill">'+esc(m.priority||'Normal')+'</span> <b>'+esc(m.subject)+'</b><div class="meta">'+esc(m.studentName||m.admissionNo||'Student')+' • '+esc(m.sentAt||'')+'</div><p>'+esc(m.message)+'</p></div>').join('')||'<div class="empty">No communications yet.</div>'}
$('refreshBtn').onclick=loadMessages;$('loginBtn').onclick=async()=>{const e=$('email').value.trim(),p=$('password').value;if(!e||!p){show($('loginMsg'),'Enter email and password.',false);return}try{await auth.signInWithEmailAndPassword(e,p)}catch(x){show($('loginMsg'),x.code==='auth/invalid-credential'?'Incorrect email or password.':x.message,false)}};init();
</script></body></html>
