<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Generator</title>
<style>body{font-family:Arial;margin:0;background:#f4f7fa;color:#17324d}.sheet{max-width:780px;margin:30px auto;background:#fff;padding:45px;box-shadow:0 3px 18px #0001}.center{text-align:center}.line{border-bottom:1px solid #333;display:inline-block;min-width:240px}.btn{padding:10px 14px;border:0;border-radius:8px;font-weight:700;cursor:pointer}@media print{.no-print{display:none!important}.sheet{box-shadow:none;margin:0;max-width:none}}</style></head><body><div class="sheet"><div class="no-print"><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn" onclick="history.back()">Back</button></div><div class="center"><h2>Government Primary School</h2><h1>PETHGAM WAGOORA</h1><p>Certificate</p></div><p>This is to certify that <span class="line" id="name"></span> has been a student of this institution.</p><p>Admission No.: <span class="line" id="adm"></span></p><p>Certificate type: <span class="line" id="type"></span></p><p>Purpose: <span class="line" id="purpose"></span></p><br><p>Date: <span id="date"></span></p><p style="text-align:right;margin-top:70px">Head of Institution</p></div><script>const p=new URLSearchParams(location.search);document.getElementById('name').textContent=p.get('name')||'';document.getElementById('adm').textContent=p.get('admissionNo')||'';document.getElementById('type').textContent=p.get('type')||'Certificate';document.getElementById('purpose').textContent=p.get('purpose')||'';document.getElementById('date').textContent=new Date().toLocaleDateString();</script></body></html>
