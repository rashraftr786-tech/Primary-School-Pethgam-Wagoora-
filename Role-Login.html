<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Common School Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #172033;
      --muted: #64748b;
      --border: #dbe2ea;
      --bg: #f1f5f9;
      --danger: #b91c1c;
      --success: #047857;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #dbeafe 0, transparent 35%),
        radial-gradient(circle at bottom right, #e0e7ff 0, transparent 35%),
        var(--bg);
      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;

      background: #fff;

      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 22px;

      padding: 32px;

      box-shadow:
        0 25px 60px rgba(15, 23, 42, 0.12);
    }

    /* =========================================================
       SCHOOL LOGO
       ========================================================= */

    .logo-wrap {
      text-align: center;
      margin-bottom: 22px;
    }

    .school-logo {
      width: 92px;
      height: 92px;

      object-fit: contain;

      display: block;

      margin: 0 auto 14px;

      border-radius: 18px;
    }

    .school-name {
      font-size: 17px;
      font-weight: 800;
      color: #172033;

      margin-bottom: 5px;
    }

    .school-subtitle {
      font-size: 12px;
      color: var(--muted);

      line-height: 1.5;
    }

    h1 {
      text-align: center;

      font-size: 25px;

      margin: 22px 0 7px;

      color: #111827;
    }

    .subtitle {
      text-align: center;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.5;

      margin-bottom: 26px;
    }

    /* =========================================================
       FORM
       ========================================================= */

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 800;

      color: #334155;
    }

    input,
    select {
      width: 100%;

      height: 49px;

      border: 1px solid var(--border);

      border-radius: 10px;

      padding: 0 14px;

      background: #fff;

      color: #111827;

      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    select {
      cursor: pointer;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 52px;
    }

    .toggle-password {
      position: absolute;

      right: 8px;

      top: 50%;

      transform: translateY(-50%);

      width: 38px;
      height: 38px;

      border: 0;

      background: transparent;

      cursor: pointer;

      border-radius: 8px;

      font-size: 18px;

      color: #64748b;
    }

    .toggle-password:hover {
      background: #f1f5f9;
    }

    .help {
      margin-top: -7px;

      margin-bottom: 18px;

      color: var(--muted);

      font-size: 11px;

      line-height: 1.5;
    }

    /* =========================================================
       LOGIN BUTTON
       ========================================================= */

    .login-btn {
      width: 100%;

      height: 50px;

      border: 0;

      border-radius: 11px;

      background: var(--primary);

      color: #fff;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.1s,
        opacity 0.2s;
    }

    .login-btn:hover {
      background: var(--primary-dark);
    }

    .login-btn:active {
      transform: translateY(1px);
    }

    .login-btn:disabled {
      opacity: 0.65;

      cursor: not-allowed;
    }

    /* =========================================================
       FORGOT PASSWORD
       ========================================================= */

    .forgot-btn {
      display: block;

      width: 100%;

      margin-top: 15px;

      padding: 5px;

      border: 0;

      background: transparent;

      color: var(--primary);

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;
    }

    .forgot-btn:hover {
      text-decoration: underline;
    }

    /* =========================================================
       MESSAGE
       ========================================================= */

    .message {
      display: none;

      margin-top: 17px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 12px;

      line-height: 1.5;

      word-break: break-word;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fef2f2;

      border: 1px solid #fecaca;

      color: var(--danger);
    }

    .message.success {
      background: #ecfdf5;

      border: 1px solid #a7f3d0;

      color: var(--success);
    }

    .message.info {
      background: #eff6ff;

      border: 1px solid #bfdbfe;

      color: #1d4ed8;
    }

    /* =========================================================
       ROLE INFORMATION
       ========================================================= */

    .role-info {
      margin-top: 18px;

      padding: 12px 14px;

      background: #f8fafc;

      border: 1px solid #e2e8f0;

      border-radius: 10px;

      font-size: 11px;

      color: #64748b;

      line-height: 1.55;
    }

    .role-info strong {
      color: #334155;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #94a3b8;

      font-size: 10px;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .login-card {
        padding: 25px 20px;

        border-radius: 18px;
      }

      .school-logo {
        width: 80px;
        height: 80px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>

  <!-- =========================================================
       FIREBASE COMPAT SDK
       Same Firebase style used by Staff-Management-Fixed.html
       ========================================================= -->

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

</head>

<body>

  <div class="login-card">

    <!-- =======================================================
         SCHOOL LOGO
         ======================================================= -->

    <div class="logo-wrap">

      <img
        src="new-logo.png"
        alt="School Logo"
        class="school-logo"
        onerror="this.style.display='none';"
      >

      <div class="school-name">
        Government Primary School Pethgam Wagoora
      </div>

      <div class="school-subtitle">
        School ERP Portal
      </div>

    </div>


    <h1>Common Login</h1>

    <div class="subtitle">
      Select your role and sign in using your registered credentials.
    </div>


    <!-- =======================================================
         ROLE SELECTOR
         ======================================================= -->

    <div class="field">

      <label for="roleSelect">
        Select Role
      </label>

      <select id="roleSelect">

        <option value="ADMIN">
          HOI / Admin
        </option>

        <option value="TEACHER">
          Teacher
        </option>

        <option value="AAYA">
          Aaya
        </option>

        <option value="COOK">
          Cook
        </option>

      </select>

    </div>


    <!-- =======================================================
         IDENTIFIER
         ======================================================= -->

    <div class="field">

      <label
        id="identifierLabel"
        for="identifier"
      >
        Admin Email
      </label>

      <input
        id="identifier"
        type="email"
        autocomplete="username"
        placeholder="Enter admin email"
      >

    </div>


    <!-- =======================================================
         PASSWORD / PIN
         ======================================================= -->

    <div class="field">

      <label
        id="passwordLabel"
        for="password"
      >
        Password
      </label>

      <div class="password-wrap">

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
        >

        <button
          type="button"
          id="togglePassword"
          class="toggle-password"
          aria-label="Show password"
        >
          👁
        </button>

      </div>

    </div>


    <div
      id="loginHelp"
      class="help"
    >
      Use your HOI / Admin Firebase email and password.
    </div>


    <!-- =======================================================
         LOGIN BUTTON
         IMPORTANT:
         No inline onclick is used.
         JavaScript attaches the click handler below.
         ======================================================= -->

    <button
      type="button"
      id="loginBtn"
      class="login-btn"
    >
      Login
    </button>


    <!-- =======================================================
         FORGOT PASSWORD
         ======================================================= -->

    <button
      type="button"
      id="forgotBtn"
      class="forgot-btn"
    >
      Forgot PIN / Password?
    </button>


    <!-- =======================================================
         MESSAGE
         ======================================================= -->

    <div
      id="message"
      class="message"
    ></div>


    <div class="role-info">

      <strong>Login information:</strong><br>

      <span id="roleInfoText">
        HOI / Admin uses the Firebase Authentication email and password.
      </span>

    </div>


    <div class="footer">
      Secure School ERP Login
    </div>

  </div>


  <!-- =========================================================
       APPLICATION SCRIPT
       ========================================================= -->

  <script>

    /* =========================================================
       FIREBASE CONFIG
       Same Firebase project as Staff-Management-Fixed.html
       ========================================================= */

    const CONFIG = {
      apiKey: "AIzaSyADB32wJq886NNqMuJk5n1zO45oSi-bdLs",
      authDomain: "gps-pethgam-wagoora-portal.firebaseapp.com",
      projectId: "gps-pethgam-wagoora-portal",
      storageBucket: "gps-pethgam-wagoora-portal.firebasestorage.app",
      messagingSenderId: "243117067000",
      appId: "1:243117067000:web:a5320441bcbaed71e4490d",
      measurementId: "G-WMXPK3229Y"
    };


    /* =========================================================
       COLLECTIONS / SESSION
       ========================================================= */

    const STAFF =
      "staff";

    const STAFF_LOGIN_INDEX =
      "staffLoginIndex";

    const SESSION_KEY =
      "GPSPETHGAM_COMMON_LOGIN_SESSION_V1";


    /* =========================================================
       FIREBASE
       ========================================================= */

    let auth = null;

    let db = null;

    let firebaseReady = false;


    /* =========================================================
       DOM HELPER
       ========================================================= */

    const $ = id =>
      document.getElementById(id);


    /* =========================================================
       MESSAGE
       ========================================================= */

    function showMessage(
      text,
      type = "error"
    ) {

      const el =
        $("message");

      el.textContent =
        String(text || "");

      el.className =
        "message show " + type;

    }


    function clearMessage() {

      const el =
        $("message");

      el.textContent =
        "";

      el.className =
        "message";

    }


    /* =========================================================
       ROLE
       ========================================================= */

    function role() {

      return $("roleSelect").value;

    }


    function roleLabel(value) {

      const labels = {

        ADMIN:
          "HOI / Admin",

        TEACHER:
          "Teacher",

        AAYA:
          "Aaya",

        COOK:
          "Cook",

        STAFF:
          "Other Staff"

      };

      return labels[value] ||
        "Unknown";

    }


    /* =========================================================
       FIREBASE INITIALIZATION
       ========================================================= */

    function initializeFirebase() {

      try {

        if (
          !window.firebase
        ) {

          throw new Error(
            "Firebase SDK did not load. Check your internet connection."
          );

        }


        /*
         * Do not initialize the default app twice.
         */

        if (
          !firebase.apps.length
        ) {

          firebase.initializeApp(
            CONFIG
          );

        }


        auth =
          firebase.auth();

        db =
          firebase.firestore();


        if (
          !auth ||
          typeof auth.signInWithEmailAndPassword !==
            "function"
        ) {

          throw new Error(
            "Firebase Authentication is not available."
          );

        }


        if (
          !db
        ) {

          throw new Error(
            "Firestore is not available."
          );

        }


        firebaseReady =
          true;


        return true;

      } catch (error) {

        firebaseReady =
          false;

        console.error(
          "Firebase initialization failed:",
          error
        );

        showMessage(
          error.message ||
          "Firebase could not be initialized.",
          "error"
        );

        return false;
      }

    }


    /* =========================================================
       NORMALIZE EMPLOYEE ID
       ========================================================= */

    function normalizeEmployeeId(
      value
    ) {

      return String(
        value || ""
      )
        .trim()
        .toUpperCase();

    }


    /* =========================================================
       STAFF ROLE CLASSIFICATION
       =========================================================

       IMPORTANT:

       staff.accessRole = login/access role

       staff.designation =
       human-readable designation

       staff.role =
       Subject / Main Responsibility

       Therefore staff.role is NEVER used here.
       ========================================================= */

    function classify(
      staff
    ) {

      if (
        !staff
      ) {

        return "";

      }


      const accessRole =
        String(
          staff.accessRole ||
          ""
        )
          .trim()
          .toUpperCase();


      /*
       * Canonical roles created by
       * Staff Management.
       */

      if (
        accessRole === "HOI" ||
        accessRole === "ADMIN"
      ) {

        return "ADMIN";

      }


      if (
        accessRole === "TEACHER"
      ) {

        return "TEACHER";

      }


      if (
        accessRole === "AAYA"
      ) {

        return "AAYA";

      }


      if (
        accessRole === "COOK"
      ) {

        return "COOK";

      }


      /*
       * Other Staff is intentionally
       * kept separate.
       */

      if (
        accessRole === "STAFF"
      ) {

        return "STAFF";

      }


      /*
       * Legacy fallback:
       *
       * Use designation, NOT staff.role.
       */

      const designation =
        String(
          staff.designation ||
          staff.roleDesignation ||
          ""
        )
          .trim();


      if (
        /head\s*of\s*institution/i
          .test(designation) ||
        /\bhoi\b/i
          .test(designation)
      ) {

        return "ADMIN";

      }


      if (
        /teacher/i
          .test(designation)
      ) {

        return "TEACHER";

      }


      if (
        /aaya/i
          .test(designation) ||
        /ayah/i
          .test(designation)
      ) {

        return "AAYA";

      }


      if (
        /cook/i
          .test(designation)
      ) {

        return "COOK";

      }


      /*
       * Never guess an unknown
       * role as Teacher.
       */

      return "";

    }


    /* =========================================================
       FIND STAFF LOGIN INDEX
       ========================================================= */

    async function findStaffLoginIndex(
      employeeId
    ) {

      const eid =
        normalizeEmployeeId(
          employeeId
        );


      if (!eid) {

        return null;

      }


      /*
       * Primary lookup:
       *
       * staffLoginIndex/{EMPLOYEE_ID}
       *
       * This is exactly how Staff Management
       * writes the login index.
       */

      const directRef =
        db
          .collection(
            STAFF_LOGIN_INDEX
          )
          .doc(eid);


      const directSnap =
        await directRef.get();


      if (
        directSnap.exists
      ) {

        return {
          id: directSnap.id,
          ...directSnap.data()
        };

      }


      /*
       * Legacy fallback:
       * Search employeeId field.
       */

      const variants = [

        String(
          employeeId || ""
        ).trim(),

        eid,

        String(
          employeeId || ""
        ).trim().toLowerCase()

      ];


      for (
        const value
        of variants
      ) {

        if (!value) {
          continue;
        }


        const snapshot =
          await db
            .collection(
              STAFF_LOGIN_INDEX
            )
            .where(
              "employeeId",
              "==",
              value
            )
            .limit(1)
            .get();


        if (
          !snapshot.empty
        ) {

          const d =
            snapshot.docs[0];


          return {
            id: d.id,
            ...d.data()
          };

        }

      }


      return null;

    }


    /* =========================================================
       ADMIN LOGIN
       ========================================================= */

    async function loginAdmin(
      email,
      password
    ) {

      const credential =
        await auth
          .signInWithEmailAndPassword(
            email,
            password
          );


      const user =
        credential.user;


      if (
        !user
      ) {

        throw new Error(
          "Firebase did not return a valid user account."
        );

      }


      /*
       * Admin authorization comes from:
       *
       * admins/{uid}
       */

      const adminSnap =
        await db
          .collection("admins")
          .doc(user.uid)
          .get();


      if (
        !adminSnap.exists
      ) {

        await auth.signOut();

        throw new Error(
          "Admin Firebase account found, but the admins record was not found for this account."
        );

      }


      const admin =
        adminSnap.data() ||
        {};


      const adminRole =
        String(
          admin.role ||
          admin.accessRole ||
          ""
        )
          .trim()
          .toLowerCase();


      /*
       * Staff Management's working admin
       * check uses role: admin.
       *
       * HOI is accepted as a legacy equivalent.
       */

      if (
        adminRole !== "admin" &&
        adminRole !== "hoi" &&
        adminRole !== "head of institution"
      ) {

        await auth.signOut();

        throw new Error(
          "This Firebase account does not have HOI / Admin access."
        );

      }


      /*
       * Active must not explicitly be false.
       */

      if (
        admin.active === false
      ) {

        await auth.signOut();

        throw new Error(
          "This administrator account is inactive."
        );

      }


      /*
       * If admins/{uid} has an email,
       * make sure it matches Firebase Auth.
       */

      const firestoreEmail =
        String(
          admin.email ||
          ""
        )
          .trim()
          .toLowerCase();


      const authEmail =
        String(
          user.email ||
          email ||
          ""
        )
          .trim()
          .toLowerCase();


      if (
        firestoreEmail &&
        firestoreEmail !== authEmail
      ) {

        await auth.signOut();

        throw new Error(
          "The Firebase account does not match the email recorded in the school admin record."
        );

      }


      /*
       * Save Common Login session.
       */

      const sessionData = {

        uid:
          user.uid,

        email:
          user.email ||
          email,

        name:
          admin.name ||
          user.displayName ||
          "Administrator",

        employeeId:
          admin.employeeId ||
          "",

        role:
          "ADMIN",

        loginAt:
          new Date().toISOString()

      };


      sessionStorage.setItem(
        SESSION_KEY,
        JSON.stringify(
          sessionData
        )
      );


      /*
       * Keep compatibility with
       * other dashboard pages.
       */

      sessionStorage.setItem(
        "loginRole",
        "ADMIN"
      );

      sessionStorage.setItem(
        "schoolLoginRole",
        "ADMIN"
      );


      /*
       * Admin / HOI dashboard.
       */

      window.location.href =
        "index.html";

    }


    /* =========================================================
       STAFF LOGIN
       ========================================================= */

    async function loginStaff(
      employeeId,
      password,
      selectedRole
    ) {

      /*
       * 1. Find staffLoginIndex.
       */

      const index =
        await findStaffLoginIndex(
          employeeId
        );


      if (
        !index
      ) {

        throw new Error(
          "Employee ID was not found. Please check the Employee ID saved by the school administrator."
        );

      }


      /*
       * Staff Management writes:
       *
       * authEmail
       * staffId
       */

      const authEmail =
        String(
          index.authEmail ||
          ""
        )
          .trim()
          .toLowerCase();


      const staffId =
        String(
          index.staffId ||
          index.staffDocId ||
          ""
        ).trim();


      if (
        !authEmail
      ) {

        throw new Error(
          "This Employee ID does not have a Firebase login email configured."
        );

      }


      if (
        !staffId
      ) {

        throw new Error(
          "The staff login index does not contain the linked staff record."
        );

      }


      /*
       * 2. Sign in using the Firebase
       * Authentication email + PIN.
       */

      const credential =
        await auth
          .signInWithEmailAndPassword(
            authEmail,
            password
          );


      const user =
        credential.user;


      /*
       * 3. Read staff/{staffId}.
       */

      const staffSnap =
        await db
          .collection(STAFF)
          .doc(staffId)
          .get();


      if (
        !staffSnap.exists
      ) {

        await auth.signOut();

        throw new Error(
          "The staff record linked to this login could not be found."
        );

      }


      const staff = {

        id:
          staffSnap.id,

        ...staffSnap.data()

      };


      /*
       * 4. Active check.
       */

      if (
        staff.active === false
      ) {

        await auth.signOut();

        throw new Error(
          "This staff account is inactive."
        );

      }


      /*
       * Staff Management uses loginEnabled.
       *
       * Only explicitly false is rejected.
       */

      if (
        staff.loginEnabled === false
      ) {

        await auth.signOut();

        throw new Error(
          "Login is disabled for this staff account."
        );

      }


      /*
       * 5. Verify Firebase Auth UID
       * when authUid exists.
       */

      if (
        staff.authUid &&
        String(
          staff.authUid
        ) !== String(
          user.uid
        )
      ) {

        await auth.signOut();

        throw new Error(
          "This Firebase login is not linked to the selected staff record."
        );

      }


      /*
       * 6. Determine actual role.
       *
       * CRITICAL:
       *
       * staff.role is NOT checked.
       *
       * Example:
       *
       * designation = Teacher
       * role = Mathematics
       * accessRole = TEACHER
       *
       * Result = TEACHER
       */

      const actualRole =
        classify(staff);


      if (
        !actualRole
      ) {

        await auth.signOut();

        throw new Error(
          "This staff record does not have a valid access role configured. Please edit the staff member in Staff Management and save the correct Role / Designation."
        );

      }


      /*
       * The selected dropdown role must
       * exactly match accessRole.
       */

      if (
        actualRole !== selectedRole
      ) {

        await auth.signOut();

        throw new Error(
          "The selected role does not match the staff record. " +
          "This staff record is configured as " +
          roleLabel(actualRole) +
          "."
        );

      }


      /*
       * Other Staff is deliberately not
       * routed to Teacher.
       */

      if (
        actualRole === "STAFF"
      ) {

        await auth.signOut();

        throw new Error(
          "This account is configured as Other Staff. A separate Other Staff dashboard is not configured in Common Login."
        );

      }


      /*
       * 7. Save staff session.
       */

      const sessionData = {

        uid:
          user.uid,

        staffId:
          staff.id,

        employeeId:
          staff.employeeId ||
          employeeId,

        name:
          staff.name ||
          "",

        designation:
          staff.designation ||
          staff.roleDesignation ||
          "",

        accessRole:
          staff.accessRole ||
          "",

        role:
          selectedRole,

        authEmail:
          staff.authEmail ||
          authEmail,

        loginAt:
          new Date().toISOString()

      };


      sessionStorage.setItem(
        SESSION_KEY,
        JSON.stringify(
          sessionData
        )
      );


      /*
       * Compatibility sessions for dashboards.
       */

      sessionStorage.setItem(
        "loginRole",
        selectedRole
      );

      sessionStorage.setItem(
        "schoolLoginRole",
        selectedRole
      );

      sessionStorage.setItem(
        "staffId",
        String(
          staff.id
        )
      );

      sessionStorage.setItem(
        "employeeId",
        String(
          staff.employeeId ||
          employeeId
        )
      );

      sessionStorage.setItem(
        "staffAuthUid",
        String(
          user.uid
        )
      );

      sessionStorage.setItem(
        "staffSession",
        JSON.stringify(
          staff
        )
      );


      /*
       * 8. Redirect to correct dashboard.
       */

      if (
        selectedRole ===
        "TEACHER"
      ) {

        window.location.href =
          "Teacher-Dashboard.html";

        return;

      }


      if (
        selectedRole ===
        "AAYA"
      ) {

        window.location.href =
          "Aaya-Dashboard.html";

        return;

      }


      if (
        selectedRole ===
        "COOK"
      ) {

        window.location.href =
          "Cook-Dashboard.html";

        return;

      }


      await auth.signOut();

      throw new Error(
        "No dashboard is configured for this role."
      );

    }


    /* =========================================================
       MAIN LOGIN HANDLER
       ========================================================= */

    async function handleLogin() {

      clearMessage();


      /*
       * Make sure Firebase is ready.
       */

      if (
        !firebaseReady
      ) {

        if (
          !initializeFirebase()
        ) {

          return;

        }

      }


      const selectedRole =
        role();


      const identifier =
        String(
          $("identifier").value ||
          ""
        ).trim();


      const password =
        String(
          $("password").value ||
          ""
        );


      if (
        !identifier
      ) {

        showMessage(
          selectedRole === "ADMIN"
            ? "Please enter the Admin email."
            : "Please enter the Employee ID."
        );

        $("identifier").focus();

        return;

      }


      if (
        !password
      ) {

        showMessage(
          selectedRole === "ADMIN"
            ? "Please enter the password."
            : "Please enter the PIN."
        );

        $("password").focus();

        return;

      }


      const button =
        $("loginBtn");


      button.disabled =
        true;

      button.textContent =
        "Signing in...";


      showMessage(
        "Connecting to Firebase Authentication...",
        "info"
      );


      try {

        if (
          selectedRole ===
          "ADMIN"
        ) {

          await loginAdmin(
            identifier,
            password
          );

        } else {

          await loginStaff(
            identifier,
            password,
            selectedRole
          );

        }

      } catch (error) {

        console.error(
          "Common Login error:",
          error
        );


        let message =
          error &&
          error.message
            ? error.message
            : "Login failed. Please try again.";


        /*
         * Friendly Firebase errors.
         */

        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message =
            selectedRole === "ADMIN"
              ? "Admin email or password is incorrect."
              : "Employee ID or PIN is incorrect.";

        }


        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          message =
            selectedRole === "ADMIN"
              ? "Admin password is incorrect."
              : "Employee PIN is incorrect.";

        }


        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          message =
            "No Firebase login account was found for this account.";

        }


        else if (
          error.code ===
          "auth/user-disabled"
        ) {

          message =
            "This Firebase login account has been disabled.";

        }


        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          message =
            "Too many login attempts. Please wait a while and try again.";

        }


        else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          message =
            "Network error while connecting to Firebase. Check your internet connection.";

        }


        showMessage(
          message,
          "error"
        );


        /*
         * Always clean up a partially
         * authenticated account after
         * validation fails.
         */

        try {

          if (
            auth &&
            auth.currentUser
          ) {

            await auth.signOut();

          }

        } catch (
          signOutError
        ) {

          console.warn(
            "Sign-out cleanup:",
            signOutError
          );

        }

      } finally {

        button.disabled =
          false;

        button.textContent =
          "Login";

      }

    }


    /* =========================================================
       FORGOT PASSWORD / PIN
       ========================================================= */

    async function handleForgotPassword() {

      clearMessage();


      if (
        !firebaseReady
      ) {

        if (
          !initializeFirebase()
        ) {

          return;

        }

      }


      const selectedRole =
        role();


      const identifier =
        String(
          $("identifier").value ||
          ""
        ).trim();


      if (
        !identifier
      ) {

        showMessage(
          selectedRole === "ADMIN"
            ? "Enter the Admin email first."
            : "Enter the Employee ID first."
        );

        $("identifier").focus();

        return;

      }


      try {

        let email =
          "";


        /*
         * Admin:
         * identifier is already the email.
         */

        if (
          selectedRole ===
          "ADMIN"
        ) {

          email =
            identifier
              .trim()
              .toLowerCase();

        }


        /*
         * Staff:
         * Employee ID -> staffLoginIndex
         * -> authEmail
         */

        else {

          const index =
            await findStaffLoginIndex(
              identifier
            );


          if (
            !index
          ) {

            throw new Error(
              "Employee ID was not found."
            );

          }


          email =
            String(
              index.authEmail ||
              ""
            )
              .trim()
              .toLowerCase();


          if (
            !email
          ) {

            throw new Error(
              "No Firebase login email is configured for this Employee ID."
            );

          }

        }


        await auth
          .sendPasswordResetEmail(
            email
          );


        showMessage(
          "A password/PIN reset email has been sent to the registered Firebase login email.",
          "success"
        );


      } catch (error) {

        console.error(
          "Password reset error:",
          error
        );


        let message =
          error.message ||
          "Unable to send the reset email.";


        if (
          error.code ===
          "auth/user-not-found"
        ) {

          message =
            "No Firebase account was found for this login.";

        }


        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "The registered login email is invalid.";

        }


        showMessage(
          message,
          "error"
        );

      }

    }


    /* =========================================================
       ROLE UI
       ========================================================= */

    function updateRoleUI() {

      const selectedRole =
        role();


      clearMessage();


      if (
        selectedRole ===
        "ADMIN"
      ) {

        $("identifierLabel")
          .textContent =
          "Admin Email";

        $("identifier")
          .type =
          "email";

        $("identifier")
          .placeholder =
          "Enter Admin Firebase email";

        $("identifier")
          .autocomplete =
          "username";

        $("passwordLabel")
          .textContent =
          "Password";

        $("password")
          .placeholder =
          "Enter Admin password";

        $("password")
          .autocomplete =
          "current-password";

        $("loginHelp")
          .textContent =
          "Use the Firebase Authentication email and password of the school HOI / Admin.";

        $("roleInfoText")
          .textContent =
          "HOI / Admin login is verified against the admins/{uid} Firestore record.";

      }


      else {

        $("identifierLabel")
          .textContent =
          "Employee ID";

        $("identifier")
          .type =
          "text";

        $("identifier")
          .placeholder =
          "Enter Employee ID";

        $("identifier")
          .autocomplete =
          "username";

        $("passwordLabel")
          .textContent =
          "PIN";

        $("password")
          .placeholder =
          "Enter your 6–8 digit PIN";

        $("password")
          .autocomplete =
          "current-password";

        $("loginHelp")
          .textContent =
          "Use the Employee ID and PIN created by the school administrator.";

        $("roleInfoText")
          .textContent =
          "Staff login is verified through staffLoginIndex and the staff record's accessRole.";

      }

    }


    /* =========================================================
       PASSWORD VISIBILITY
       ========================================================= */

    function togglePassword() {

      const input =
        $("password");

      const button =
        $("togglePassword");


      if (
        input.type ===
        "password"
      ) {

        input.type =
          "text";

        button.textContent =
          "🙈";

        button.setAttribute(
          "aria-label",
          "Hide password"
        );

      }

      else {

        input.type =
          "password";

        button.textContent =
          "👁";

        button.setAttribute(
          "aria-label",
          "Show password"
        );

      }

    }


    /* =========================================================
       ENTER KEY
       ========================================================= */

    function handleEnter(
      event
    ) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        handleLogin();

      }

    }


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        /*
         * Attach events explicitly.
         *
         * This avoids the previous problem where
         * the Login button could appear clickable
         * but the JavaScript handler was not available.
         */

        $("loginBtn")
          .addEventListener(
            "click",
            handleLogin
          );


        $("forgotBtn")
          .addEventListener(
            "click",
            handleForgotPassword
          );


        $("roleSelect")
          .addEventListener(
            "change",
            updateRoleUI
          );


        $("togglePassword")
          .addEventListener(
            "click",
            togglePassword
          );


        $("identifier")
          .addEventListener(
            "keydown",
            handleEnter
          );


        $("password")
          .addEventListener(
            "keydown",
            handleEnter
          );


        /*
         * Set initial role UI.
         */

        updateRoleUI();


        /*
         * Initialize Firebase immediately.
         */

        initializeFirebase();


        /*
         * Show a connection status only
         * if Firebase initialization fails.
         */

        if (
          firebaseReady
        ) {

          console.log(
            "Common Login: Firebase initialized successfully."
          );

        }

      }
    );

  </script>

</body>
