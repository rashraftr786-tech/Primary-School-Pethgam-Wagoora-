<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GPS Pethgam Wagoora — Secure Login</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#eef3f8;margin:0;color:#17324d}.wrap{max-width:520px;margin:6vh auto;padding:20px}.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 35px #0001}.logo{width:80px;height:80px;object-fit:contain;display:block;margin:auto}.center{text-align:center}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd7e3;border-radius:10px;font-size:16px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.role{border:1px solid #ccd7e3;border-radius:12px;padding:14px;cursor:pointer;text-align:center;font-weight:800}.role.active{border-color:#1769aa;background:#e9f3fb}.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:#1769aa;color:#fff;width:100%}.muted{color:#65788c;font-size:13px}.status{margin-top:14px;padding:10px;border-radius:10px;background:#f3f6f9;min-height:20px}.err{color:#a11}.ok{color:#176b38}.small{font-size:12px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="center"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><h1>School ERP Login</h1><p class="muted">Government Primary School Pethgam Wagoora</p></div>
<div class="roles">
<div id="studentRole" class="role active" onclick="selectRole('STUDENT')">🎓 Student</div>
<div id="staffRole" class="role" onclick="selectRole('STAFF')">👨‍🏫 Teacher / Staff</div>
<div id="hoiRole" class="role" onclick="selectRole('HOI')">🏫 HOI</div>
<div id="adminRole" class="role" onclick="selectRole('ADMIN')">⚙️ System Admin</div>
</div>
<div class="field"><label id="identifierLabel">Admission Number / Student ID</label><input id="identifier" autocomplete="username"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn primary" onclick="login()">Sign In</button>
<div id="status" class="status"></div>
<p class="muted small">Attachments are not stored in Firebase Storage. Applications and approval records are Firestore-only.</p>
</div></div>
<script>
const CONFIG = window.firebaseConfig || window.FIREBASE_CONFIG || (typeof firebaseConfig!=='undefined'?firebaseConfig:null);
let auth,db,role='STUDENT';
function $(id){return document.getElementById(id)}
function setStatus(t,cls=''){ $('status').className='status '+cls; $('status').textContent=t; }
function selectRole(r){
 role=r;
 ['studentRole','staffRole','hoiRole','adminRole'].forEach(x=>$(x).classList.remove('active'));
 $(r==='STUDENT'?'studentRole':r==='STAFF'?'staffRole':r==='HOI'?'hoiRole':'adminRole').classList.add('active');
 $('identifierLabel').textContent=r==='STUDENT'?'Admission Number / Student ID':r==='STAFF'?'Employee ID':'Firebase Authentication Email';
 $('identifier').type=r==='STUDENT'||r==='STAFF'?'text':'email';
 $('identifier').placeholder=r==='STUDENT'?'e.g. GPSPGW-2021-0004':r==='STAFF'?'e.g. TCH-001':'name@example.com';
 $('password').placeholder=r==='STAFF'?'Firebase Authentication PIN':'Firebase Authentication password';
}
function init(){
 if(!firebase.apps.length)firebase.initializeApp(CONFIG);
 auth=firebase.auth();db=firebase.firestore();
}
async function login(){
 try{
  setStatus('Signing in…');
  if(!auth)init();
  const id=$('identifier').value.trim(),pw=$('password').value;
  if(!id||!pw)throw new Error('Enter the login details.');
  if(role==='STUDENT'){
    const idx=await db.collection('studentLoginIndex').doc(id).get();
    if(!idx.exists)throw new Error('Student login ID was not found.');
    const email=String(idx.data().authEmail||'').trim().toLowerCase();
    if(!email)throw new Error('Student login is not configured. Contact the school.');
    const c=await auth.signInWithEmailAndPassword(email,pw);
    const a=await db.collection('studentAccounts').doc(c.user.uid).get();
    if(!a.exists)throw new Error('Student account record is missing.');
    sessionStorage.setItem('schoolLoginRole','STUDENT');
    sessionStorage.setItem('studentUid',c.user.uid);
    location.href='Student-Portal.html';
    return;
  }
  if(role==='STAFF'){
    const eid=id.toUpperCase();
    const idx=await db.collection('staffLoginIndex').doc(eid).get();
    if(!idx.exists)throw new Error('Employee ID was not found.');
    const email=String(idx.data().authEmail||'').trim().toLowerCase();
    if(!email)throw new Error('Staff Firebase login is not configured.');
    const c=await auth.signInWithEmailAndPassword(email,pw);
    const sid=String(idx.data().staffId||'');
    if(!sid)throw new Error('Staff login index is incomplete.');
    const s=await db.collection('staff').doc(sid).get();
    if(!s.exists||s.data().authUid!==c.user.uid)throw new Error('Staff login is not correctly linked.');
    const d=s.data()||{}, ar=String(d.accessRole||'').toUpperCase();
    if(ar==='TEACHER')sessionStorage.setItem('schoolLoginRole','TEACHER');
    else sessionStorage.setItem('schoolLoginRole',ar||'STAFF');
    sessionStorage.setItem('staffId',sid);
    sessionStorage.setItem('staffAuthUid',c.user.uid);
    sessionStorage.setItem('employeeId',d.employeeId||eid);
    location.href=ar==='TEACHER'?'Teacher-Dashboard.html':ar==='AAYA'?'Aaya-Dashboard.html':ar==='COOK'?'Cook-Dashboard.html':'Teacher-Dashboard.html';
    return;
  }
  const c=await auth.signInWithEmailAndPassword(id,pw);
  const a=await db.collection('admins').doc(c.user.uid).get();
  if(!a.exists)throw new Error('Administrator record not found.');
  const d=a.data()||{}, ar=String(d.role||'').toLowerCase();
  if(d.active===false)throw new Error('This administrator account is inactive.');
  if(role==='HOI' && ar!=='hoi' && ar!=='admin')throw new Error('This account is not configured for HOI access.');
  if(role==='ADMIN' && ar!=='admin')throw new Error('This account is not configured for System Admin access.');
  sessionStorage.setItem('schoolLoginRole',ar==='admin'?'ADMIN':'HOI');
  sessionStorage.setItem('adminUid',c.user.uid);
  location.href=ar==='admin'?'Admin-Dashboard.html':'HOI-Dashboard.html';
 }catch(e){
  try{if(auth&&auth.currentUser)await auth.signOut()}catch(_){}
  setStatus(e.message||'Login failed.','err');
 }
}
selectRole('STUDENT');
</script>
</body>
</html>
