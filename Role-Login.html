<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#3f3f91"><title>School ERP — Common Login</title>
<link rel="icon" href="new-logo.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="role-dashboard.css">
</head><body>
<div class="login-wrap"><div class="login-card">
<img class="login-logo" src="new-logo.png" alt="School logo">
<h1 class="login-title">School ERP Login</h1>
<p class="login-sub">Government Primary School Pethgam Wagoora<br>Choose your role and sign in to your school workspace.</p>
<div class="role-grid">
  <div class="role-option"><input checked type="radio" name="role" id="rAdmin" value="ADMIN"><label for="rAdmin"><i class="fa-solid fa-user-shield"></i>HOI / Admin</label></div>
  <div class="role-option"><input type="radio" name="role" id="rTeacher" value="TEACHER"><label for="rTeacher"><i class="fa-solid fa-chalkboard-user"></i>Teacher</label></div>
  <div class="role-option"><input type="radio" name="role" id="rAaya" value="AAYA"><label for="rAaya"><i class="fa-solid fa-person-dress"></i>Aaya</label></div>
  <div class="role-option"><input type="radio" name="role" id="rCook" value="COOK"><label for="rCook"><i class="fa-solid fa-utensils"></i>Cook</label></div>
</div>
<div class="login-field"><label id="idLabel">HOI / Administrator Email</label><input id="identifier" type="email" autocomplete="username" placeholder="Enter administrator email"></div>
<div class="login-field"><label id="pwLabel">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div>
<button class="login-main" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
<button class="forgot" id="forgotBtn">Forgot Password / PIN?</button>
<div class="forgot-box" id="forgotBox"><div class="login-field"><label id="forgotLabel">Administrator Email</label><input id="forgotIdentifier" placeholder="Enter your email or Employee ID"></div><button class="btn" id="sendReset">Send Reset Email</button></div>
<div class="login-msg" id="msg"></div>
<p style="text-align:center;color:#9a9eae;font-size:8px;margin:17px 0 0">Secure Firebase Authentication • GPS Pethgam Wagoora</p>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<script>
(function(){
 const $=id=>document.getElementById(id);let auth,db;
 const roles=[...document.querySelectorAll('input[name="role"]')];
 try{if(!firebase.apps.length)firebase.initializeApp(window.GPS_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore()}catch(e){show('Firebase could not initialize: '+e.message,'err');return}
 function role(){return document.querySelector('input[name="role"]:checked').value}
 function show(t,c){$('msg').textContent=t;$('msg').className='login-msg '+c}
 function mode(){const r=role(),staff=r!=='ADMIN';$('idLabel').textContent=staff?'Employee ID':'HOI / Administrator Email';$('identifier').type=staff?'text':'email';$('identifier').placeholder=staff?'Enter Employee ID':'Enter administrator email';$('pwLabel').textContent=staff?'PIN':'Password';$('password').placeholder=staff?'Enter PIN':'Enter password';$('forgotLabel').textContent=staff?'Employee ID':'Administrator Email';$('forgotIdentifier').placeholder=staff?'Enter Employee ID':'Enter administrator email'}
 roles.forEach(x=>x.addEventListener('change',mode));
 async function idx(e){const d=await db.collection('staffLoginIndex').doc(e).get();return d.exists?d.data():null}
 function classify(s){
  const ar=String(s.accessRole||'').trim().toUpperCase();
  if(ar==='HOI'||ar==='ADMIN') return 'ADMIN';
  if(ar==='AAYA') return 'AAYA';
  if(ar==='COOK') return 'COOK';
  if(ar==='TEACHER'||ar==='STAFF'||ar==='') return 'TEACHER';
  const t=(s.designation||'')+' '+(s.role||'')+' '+(s.staffType||'');
  if(/cook|cook cum helper/i.test(t))return'COOK';
  if(/aaya|ayah/i.test(t))return'AAYA';
  return'TEACHER';
}
function normId(v){return String(v||'').trim();}
async function findStaffIndexVariants(eid){
  const raw=normId(eid), variants=[raw,raw.toUpperCase(),raw.toLowerCase()];
  const unique=[...new Set(variants.filter(Boolean))];
  for(const key of unique){
    const d=await db.collection('staffLoginIndex').doc(key).get();
    if(d.exists) return {id:d.id,...d.data()};
  }
  return null;
}
 async function ensurePrimaryFirebase(){
  if(!window.firebase) throw new Error('Firebase SDK did not load. Check your internet connection and reload the page.');
  if(!firebase.apps.length) firebase.initializeApp(CONFIG);
  if(!auth) auth=firebase.auth();
  if(!db) db=firebase.firestore();
  if(!auth || typeof auth.signInWithEmailAndPassword!=="function") throw new Error('Firebase Authentication is not available on this page.');
  return {auth,db};
}
async function login(){const r=role(),id=$('identifier').value.trim(),pw=$('password').value;if(!id||!pw)return show('Please enter all required credentials.','err');$('loginBtn').disabled=true;show('Connecting to Firebase…','ok');try{await ensurePrimaryFirebase();await auth.signOut().catch(()=>{});
   if(r==='ADMIN'){
     await auth.signInWithEmailAndPassword(id,pw);const u=auth.currentUser,a=await db.collection('admins').doc(u.uid).get();
     if(!a.exists||!['admin','hoi'].includes(String(a.data().role||'').toLowerCase())||a.data().active!==true)throw new Error('This account is not an active school HOI/Administrator account.');
     sessionStorage.setItem('GPSPETHGAM_ROLE_SESSION_V1',JSON.stringify({uid:u.uid,role:'HOI',name:a.data().name||'HOI / Admin',email:u.email}));location.href='index.html';return;
   }
   const m=await findStaffIndexVariants(id);if(!m||!m.authEmail||!m.staffId)throw new Error('Staff login is not configured for this Employee ID. Ask the HOI to create/link the Firebase login.');
   await auth.signInWithEmailAndPassword(String(m.authEmail).toLowerCase(),pw);const u=auth.currentUser,d=await db.collection('staff').doc(m.staffId).get();
   if(!d.exists||String(d.data().status||'Active').toLowerCase()==='inactive'||d.data().loginEnabled===false){await auth.signOut();throw new Error('Staff record not found, inactive, or login is disabled.')}
   const s={id:d.id,...d.data()};if(s.authUid&&s.authUid!==u.uid){await auth.signOut();throw new Error('Firebase account is not correctly linked to this staff record.')}
   if(classify(s)!==r){await auth.signOut();throw new Error('The selected role does not match the staff record.')}
   const roleSession={uid:u.uid,staffId:s.id,employeeId:s.employeeId||id,name:s.name||'',role:r,loginAt:new Date().toISOString()};
   sessionStorage.setItem('GPSPETHGAM_ROLE_SESSION_V1',JSON.stringify(roleSession));
   if(r==='TEACHER') sessionStorage.setItem('GPSPETHGAM_STAFF_SESSION_V2',JSON.stringify({staffId:s.id,name:s.name||'',employeeId:s.employeeId||id,role:s.accessRole||'Staff',loginAt:roleSession.loginAt}));
   location.href=r==='AAYA'?'Aaya-Dashboard.html':r==='COOK'?'Cook-Dashboard.html':'Staff-Personal-Dashboard-Tr.html';
 }catch(e){show(e.code?e.code+': '+e.message:e.message,'err')}finally{$('loginBtn').disabled=false}}
 async function reset(){const r=role(),id=$('forgotIdentifier').value.trim();if(!id)return show('Enter your email or Employee ID first.','err');$('sendReset').disabled=true;try{let email=id;if(r!=='ADMIN'){const m=await findStaffIndexVariants(id);if(!m||!m.authEmail)throw new Error('No Firebase login is linked to this Employee ID.');email=m.authEmail}await auth.sendPasswordResetEmail(email);show('Password reset email sent to the registered Firebase login address. Check inbox and spam.','ok')}catch(e){show('Could not send reset email: '+e.message,'err')}finally{$('sendReset').disabled=false}}
 $('loginBtn').onclick=login;$('sendReset').onclick=reset;$('forgotBtn').onclick=()=>{$('forgotBox').style.display=$('forgotBox').style.display==='block'?'none':'block'};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});mode();
})();
</script></body></html>
