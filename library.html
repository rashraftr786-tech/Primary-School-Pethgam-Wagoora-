<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Library Management - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>Library Management</h1><p>Manage books, members and issue/return activity.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><h3>Add Book</h3><div class="grid"><div class="field"><label>Accession No.</label><input id="acc" placeholder="LIB-001"></div><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Author</label><input id="author"></div><div class="field"><label>Category</label><input id="category"></div><div class="field"><label>Copies</label><input id="copies" type="number" min="1" value="1"></div><div class="field"><label>Location</label><input id="location" value="Library"></div></div><div class="actions"><button class="btn ok" onclick="addBook()">Add Book</button></div></section><section class="card"><h3>Issue / Return</h3><div class="grid"><div class="field"><label>Book</label><select id="book"></select></div><div class="field"><label>Student / Member</label><input id="member" placeholder="Student ID / Name"></div><div class="field"><label>Action</label><select id="action"><option>Issue</option><option>Return</option></select></div><div class="field"><label>Date</label><input id="date" type="date"></div></div><div class="actions"><button class="btn" onclick="transaction()">Record Transaction</button></div></section><section class="card"><div class="grid"><div class="field"><label>Search Books</label><input id="q" oninput="render()"></div></div><div class="table-wrap"><table><thead><tr><th>Accession</th><th>Title</th><th>Author</th><th>Category</th><th>Total</th><th>Available</th><th>Location</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card"><h3>Recent Transactions</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Book</th><th>Member</th><th>Action</th></tr></thead><tbody id="txrows"></tbody></table></div></section></main><script>
const BKEY='GPSPETHGAM_LIBRARY_BOOKS_V1',TKEY='GPSPETHGAM_LIBRARY_TRANSACTIONS_V1';date.value=new Date().toISOString().slice(0,10);function books(){try{return JSON.parse(localStorage.getItem(BKEY)||'[]')}catch{return[]}}function tx(){try{return JSON.parse(localStorage.getItem(TKEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(BKEY,JSON.stringify(a))}function addBook(){let a=books();if(!title.value)return alert('Enter book title.');a.push({id:crypto.randomUUID(),acc:acc.value||('LIB-'+String(a.length+1).padStart(3,'0')),title:title.value,author:author.value,category:category.value,copies:Number(copies.value||1),available:Number(copies.value||1),location:location.value});save(a);['acc','title','author','category'].forEach(x=>document.getElementById(x).value='');render()}function transaction(){let a=books(),b=a.find(x=>x.id===book.value),n=member.value.trim();if(!b||!n)return alert('Select a book and enter member.');if(action.value==='Issue'){if(b.available<1)return alert('No available copy.');b.available--}else{if(b.available>=b.copies)return alert('All copies are already in library.');b.available++}save(a);let t=tx();t.unshift({date:date.value,book:b.title,member:n,action:action.value});localStorage.setItem(TKEY,JSON.stringify(t));member.value='';render()}function del(id){save(books().filter(x=>x.id!==id));render()}function render(){let q=(document.getElementById('q').value||'').toLowerCase(),a=books().filter(x=>JSON.stringify(x).toLowerCase().includes(q));book.innerHTML=a.map(x=>`<option value="${x.id}">${x.acc} — ${x.title}</option>`).join('')||'<option value="">No books</option>';rows.innerHTML=a.map(x=>`<tr><td>${x.acc}</td><td><b>${x.title}</b></td><td>${x.author||'—'}</td><td>${x.category||'—'}</td><td>${x.copies}</td><td>${x.available}</td><td>${x.location}</td><td><button class="btn danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="8">No books.</td></tr>';txrows.innerHTML=tx().slice(0,20).map(x=>`<tr><td>${x.date}</td><td>${x.book}</td><td>${x.member}</td><td><span class="pill">${x.action}</span></td></tr>`).join('')||'<tr><td colspan="4">No transactions.</td></tr>'}render();
</script></body></html>
