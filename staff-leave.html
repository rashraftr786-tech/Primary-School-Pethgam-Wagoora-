<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Staff Leave Management - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>Staff Leave Management</h1><p>Apply, track and approve staff leave records.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>Staff</label><select id="staff"></select></div><div class="field"><label>From</label><input id="from" type="date"></div><div class="field"><label>To</label><input id="to" type="date"></div><div class="field"><label>Leave Type</label><select id="type"><option>Casual Leave</option><option>Medical Leave</option><option>Earned Leave</option><option>Other</option></select></div></div><div class="field"><label>Reason</label><textarea id="reason"></textarea></div><div class="actions"><button class="btn ok" onclick="saveLeave()">Save Leave Application</button><button class="btn secondary" onclick="clearForm()">Clear</button></div></section><section class="card"><div class="grid"><div class="field"><label>Filter</label><select id="filter" onchange="render()"><option>All</option><option>Pending</option><option>Approved</option><option>Rejected</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Staff</th><th>Dates</th><th>Type</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const SKEY='GPSPETHGAM_STAFF_MASTER_V1',KEY='GPSPETHGAM_STAFF_LEAVE_V1';function sd(){try{return JSON.parse(localStorage.getItem(SKEY)||'[]')}catch{return[]}}function ld(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function init(){staff.innerHTML=sd().filter(s=>s.status!=='Inactive').map(s=>`<option value="${s.id}">${s.staffId} — ${s.name}</option>`).join('')||'<option value="">No staff</option>';render()}function clearForm(){reason.value='';from.value='';to.value=''}function saveLeave(){if(!staff.value||!from.value||!to.value)return alert('Select staff and leave dates.');if(to.value<from.value)return alert('To date cannot be before From date.');let a=ld();a.push({id:crypto.randomUUID(),staffId:staff.value,from:from.value,to:to.value,type:type.value,reason:reason.value,status:'Pending',createdAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(a));clearForm();render()}function act(id,v){let a=ld(),x=a.find(z=>z.id===id);if(x){x.status=v;localStorage.setItem(KEY,JSON.stringify(a));render()}}function render(){let f=filter.value,a=ld().filter(x=>f==='All'||x.status===f);rows.innerHTML=a.map(x=>{let s=sd().find(z=>z.id===x.staffId)||{};return `<tr><td>${s.name||x.staffId}</td><td>${x.from} → ${x.to}</td><td>${x.type}</td><td>${x.reason||'—'}</td><td><span class="pill ${x.status==='Approved'?'ok':x.status==='Rejected'?'danger':'warn'}">${x.status}</span></td><td>${x.status==='Pending'?`<button class="btn ok" onclick="act('${x.id}','Approved')">Approve</button> <button class="btn danger" onclick="act('${x.id}','Rejected')">Reject</button>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="6">No leave applications.</td></tr>'}init();
</script></body></html>
