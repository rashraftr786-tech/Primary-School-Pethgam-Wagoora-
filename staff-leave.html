<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Leave Management — GPS Pethgam Wagoora</title><style>
:root{--blue:#0056b3;--navy:#12355b;--gold:#d4a72c;--bg:#f4f7fb;--card:#fff;--muted:#64748b;--border:#dbe4ef;--danger:#c0392b;--ok:#16803c}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172033}header{background:linear-gradient(135deg,#0056b3,#12355b);color:#fff;padding:20px}header .head{max-width:1200px;margin:auto;display:flex;gap:16px;align-items:center}header img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.9}.wrap{max-width:1200px;margin:20px auto;padding:0 14px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #12355b12}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.field textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#64748b}.btn.ok{background:var(--ok)}.btn.danger{background:var(--danger)}.btn.gold{background:#a87900}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px;border-radius:12px;background:#eef5ff;border:1px solid #d6e7ff}.stat b{display:block;font-size:25px;color:var(--blue)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--border);padding:9px;text-align:left;font-size:13px;vertical-align:top}th{background:#f1f5f9;color:#334155}.table-wrap{overflow:auto}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f1ff;color:#0757a6;font-size:11px;font-weight:700}.muted{color:var(--muted)}.empty{text-align:center;padding:25px;color:var(--muted)}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}a.back{color:#fff;text-decoration:none;font-weight:700}.notice{padding:10px;border-radius:8px;background:#fff7db;border:1px solid #f0d57a;margin-bottom:12px}@media(max-width:800px){.grid,.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:500px){.grid,.stats{grid-template-columns:1fr}header .head{align-items:flex-start}h1{font-size:20px}}</style></head><body><header><div class="head"><img src="new-logo.png" alt="School Logo"><div><div id="identity" style="font-weight:700;margin-bottom:10px"></div><h1>Staff Leave Management</h1><p>Record, review and track staff leave requests.</p></div><div style="margin-left:auto"><a class="back" href="index.html">← Dashboard</a></div></div></header><div id="accessDenied" class="card" style="display:none"><h2>Access Required</h2><p>Please sign in from the Staff Personal Dashboard.</p><a class="btn" href="Staff-Personal-Dashboard.html">Open Staff Dashboard</a></div><main id="app" class="wrap"><div class="card"><h2>Leave Request</h2><div class="grid"><div class="field"><label>Staff</label><select id="staff"></select></div><div class="field"><label>From</label><input id="from" type="date"></div><div class="field"><label>To</label><input id="to" type="date"></div><div class="field"><label>Leave Type</label><select id="type"><option>Casual Leave</option><option>Medical Leave</option><option>Earned Leave</option><option>Other</option></select></div><div class="field"><label>Reason</label><input id="reason"></div><div class="field"><label>Decision</label><select id="decision"><option>Pending</option><option>Approved</option><option>Rejected</option></select></div></div><div class="actions"><button class="btn ok" onclick="save()">Save Request</button></div></div><div class="card"><h2>Leave Register</h2><div class="table-wrap"><table><thead><tr><th>Staff</th><th>Dates</th><th>Type</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
const SKEY='GPSPETHGAM_STAFF_V1',LKEY='GPSPETHGAM_STAFF_LEAVE_V1',SESSION='GPSPETHGAM_STAFF_SESSION_V1';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function ss(){try{return JSON.parse(localStorage.getItem(SKEY)||'[]')}catch(e){return[]}}
function ls(){try{return JSON.parse(localStorage.getItem(LKEY)||'[]')}catch(e){return[]}}
function session(){try{return JSON.parse(localStorage.getItem(SESSION)||'null')}catch(e){return null}}
function isHOI(){let s=session();return !!s&&s.role==='HOI'}
function visibleStaff(){let all=ss().filter(s=>s.status!=='Inactive'),me=session();if(!me)return[];return isHOI()?all:all.filter(s=>s.id===me.staffId)}
function init(){let me=session();if(!me){$('accessDenied').style.display='block';$('app').style.display='none';return}$('accessDenied').style.display='none';$('app').style.display='block';let list=visibleStaff();$('identity').textContent=isHOI()?'Signed in as HOI — manage all staff leave requests':'Signed in as '+(me.name||'Staff member')+' — personal leave only';$('staff').innerHTML=list.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.employeeId||'')}</option>`).join('')||'<option value="">No staff record</option>';$('staff').disabled=!isHOI();render()}
function save(){let sid=$('staff').value;if(!sid||!$('from').value||!$('to').value)return alert('Select staff and leave dates.');if($('to').value<$('from').value)return alert('Leave To date cannot be before From date.');let me=session();if(!isHOI()&&sid!==me.staffId)return alert('You may apply leave only for yourself.');let a=ls();a.unshift({id:(window.crypto&&typeof window.crypto.randomUUID==='function'?window.crypto.randomUUID():'leave-'+Date.now()+'-'+Math.random().toString(36).slice(2)),staffId:sid,from:$('from').value,to:$('to').value,type:$('type').value,reason:$('reason').value.trim(),decision:'Pending',createdAt:new Date().toISOString()});try{localStorage.setItem(LKEY,JSON.stringify(a))}catch(e){return alert('Unable to save leave request. Browser storage may be full.')}$('reason').value='';render()}
function setDecision(id,v){if(!isHOI())return alert('Only the HOI can approve or reject leave.');let a=ls(),x=a.find(r=>r.id===id);if(x){x.decision=v;localStorage.setItem(LKEY,JSON.stringify(a));render()}}
function del(id){let a=ls(),x=a.find(r=>r.id===id),me=session();if(!x)return;if(!isHOI()&&x.staffId!==me.staffId)return alert('You may delete only your own request.');if(confirm('Delete request?')){localStorage.setItem(LKEY,JSON.stringify(a.filter(r=>r.id!==id)));render()}}
function render(){let staffMap=Object.fromEntries(ss().map(s=>[s.id,s]));let allowed=new Set(visibleStaff().map(s=>s.id));let a=ls().filter(x=>allowed.has(x.staffId));$('rows').innerHTML=a.map(x=>{let s=staffMap[x.staffId]||{};return `<tr><td>${esc(s.name||'Unknown')}</td><td>${esc(s.employeeId||'')}</td><td>${esc(x.from)} → ${esc(x.to)}</td><td>${esc(x.type)}</td><td>${esc(x.reason||'')}</td><td><select ${isHOI()?'':'disabled'} onchange="setDecision('${esc(x.id)}',this.value)"><option ${x.decision==='Pending'?'selected':''}>Pending</option><option ${x.decision==='Approved'?'selected':''}>Approved</option><option ${x.decision==='Rejected'?'selected':''}>Rejected</option></select></td><td><button class="btn danger" onclick="del('${esc(x.id)}')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No leave requests.</td></tr>'}
init();
</script></body></html>
