<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>School Notices & Circulars - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>School Notices & Circulars</h1><p>Create and maintain notices, circulars and announcements.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>Notice No.</label><input id="no" placeholder="NOTICE/2026/001"></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Audience</label><select id="audience"><option>All</option><option>Students</option><option>Parents</option><option>Staff</option></select></div><div class="field"><label>Priority</label><select id="priority"><option>Normal</option><option>Important</option><option>Urgent</option></select></div></div><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Notice / Circular Text</label><textarea id="body" style="min-height:150px"></textarea></div><div class="actions"><button class="btn ok" onclick="saveNotice()">Publish / Save Notice</button><button class="btn secondary" onclick="clearForm()">Clear</button></div></section><section class="card"><div class="grid"><div class="field"><label>Search</label><input id="q" oninput="render()"></div></div><div id="cards"></div></section></main><script>
const KEY='GPSPETHGAM_SCHOOL_NOTICES_V1';date.value=new Date().toISOString().slice(0,10);function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function clearForm(){no.value='';title.value='';body.value='';priority.value='Normal';audience.value='All'}function saveNotice(){if(!title.value||!body.value)return alert('Enter title and notice text.');let a=data();a.unshift({id:crypto.randomUUID(),no:no.value||('NOTICE/'+new Date().getFullYear()+'/'+String(a.length+1).padStart(3,'0')),date:date.value,audience:audience.value,priority:priority.value,title:title.value,body:body.value,createdAt:new Date().toISOString()});save(a);clearForm();render()}function del(id){save(data().filter(x=>x.id!==id));render()}function printNotice(id){let x=data().find(z=>z.id===id);if(!x)return;let w=open('','_blank');w.document.write(`<html><head><title>${x.title}</title></head><body style="font-family:Arial;padding:40px"><h2 style="text-align:center">GOVERNMENT PRIMARY SCHOOL PETHGAM WAGOORA</h2><hr><p><b>Notice No.:</b> ${x.no} &nbsp; <b>Date:</b> ${x.date}</p><h2>${x.title}</h2><p><b>For:</b> ${x.audience} &nbsp; <b>Priority:</b> ${x.priority}</p><div style="white-space:pre-wrap;line-height:1.7">${x.body}</div><br><p style="text-align:right">Head Teacher</p><script>print()<\\/script></body></html>`);w.document.close()}function render(){let q=(document.getElementById('q').value||'').toLowerCase(),a=data().filter(x=>JSON.stringify(x).toLowerCase().includes(q));cards.innerHTML=a.map(x=>`<div class="module" style="margin-bottom:10px"><div><span class="pill ${x.priority==='Urgent'?'danger':x.priority==='Important'?'warn':''}">${x.priority}</span> <span class="pill">${x.audience}</span></div><h3>${x.title}</h3><p><b>${x.no}</b> · ${x.date}</p><p style="white-space:pre-wrap">${x.body}</p><div class="actions"><button class="btn light" onclick="printNotice('${x.id}')">Print</button><button class="btn danger" onclick="del('${x.id}')">Delete</button></div></div>`).join('')||'<p>No notices available.</p>'}render();
</script></body></html>
