<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Applications</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<style>body{font-family:Arial;margin:0;background:#eef3f8;color:#18344f}main{max-width:950px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd8e4;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#1769aa;color:#fff}.row{border:1px solid #d9e3ec;border-radius:10px;padding:12px;margin:8px 0}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:12px}.muted{color:#6b7d8f;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body>
<main><a href="Student-Portal.html">← Student Portal</a><div class="card"><h1>My Applications</h1><p class="muted">Leave and certificate requests are stored in Firestore. No Firebase Storage is used.</p></div>
<div class="card"><h2>Apply for Student Leave</h2><div class="grid"><div class="field"><label>From</label><input id="from" type="date"></div><div class="field"><label>To</label><input id="to" type="date"></div></div><div class="field"><label>Reason</label><textarea id="reason" rows="4"></textarea></div><button class="btn primary" onclick="submitLeave()">Submit Leave</button><span id="leaveMsg"></span></div>
<div class="card"><h2>Request Certificate</h2><div class="grid"><div class="field"><label>Certificate Type</label><select id="type"><option>Bonafide Certificate</option><option>Date of Birth Certificate</option><option>Character Certificate</option><option>Study Certificate</option><option>Other</option></select></div><div class="field"><label>Purpose</label><input id="purpose"></div></div><div class="field"><label>Remarks</label><textarea id="cremarks" rows="3"></textarea></div><button class="btn primary" onclick="submitCert()">Submit Request</button><span id="certMsg"></span></div>
<div class="card"><h2>Application History</h2><div id="history"></div></div></main>
<script>
const CONFIG=window.firebaseConfig||window.FIREBASE_CONFIG||(typeof firebaseConfig!=='undefined'?firebaseConfig:null);let auth,db,current,student,uid;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function init(){if(!firebase.apps.length)firebase.initializeApp(CONFIG);auth=firebase.auth();db=firebase.firestore();uid=auth.currentUser?.uid;if(!uid){location.href='Role-Login.html';return false}const a=await db.collection('studentAccounts').doc(uid).get();if(!a.exists){location.href='Role-Login.html';return false}current=a.data()||{};const sid=current.studentRecordId||current.sourceAdmissionId;if(!sid)throw new Error('Student account is not linked to a master record.');const s=await db.collection('students').doc(sid).get();if(!s.exists)throw new Error('Student record not found.');student={id:sid,...s.data()};return true}
async function assignedTeachers(){let u=Array.isArray(student.assignedTeacherUids)?student.assignedTeacherUids:[];if(u.length)return u;const staff=await db.collection('staff').where('accessRole','==','TEACHER').get();const cls=String(student.classJoining||student.className||student.class||'').trim().toLowerCase();return staff.docs.filter(d=>{const x=d.data()||{};const c=(x.assignedClasses||x.classes||[]).map(v=>String(v).trim().toLowerCase());return c.includes(cls)}).map(d=>d.data().authUid).filter(Boolean)}
async function notify(to,title,message,type,id){if(!to)return;await db.collection('notifications').add({recipientUid:to,title,message,type,relatedCollection:type,relatedDocumentId:id,read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}
async function submitLeave(){const from=$('from').value,to=$('to').value,reason=$('reason').value.trim();if(!from||!to||!reason)return $('leaveMsg').textContent=' Complete all fields.';if(to<from)return $('leaveMsg').textContent=' To date cannot be before From date.';const teachers=await assignedTeachers();const ref=db.collection('studentLeaves').doc();await ref.set({studentRecordId:student.id,studentUid:uid,studentName:student.name||student.studentName||'',admissionNo:student.admissionNo||student.admissionNumber||'',from,to,reason,assignedTeacherUids:teachers,status:'Pending',teacherStatus:'Pending',hoiStatus:'Pending',createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});for(const t of teachers){try{await notify(t,'New student leave application',(student.name||'Student')+' submitted a leave request.','studentLeaves',ref.id)}catch(e){}}$('leaveMsg').textContent=' Submitted.';await loadHistory()}
async function submitCert(){const type=$('type').value,purpose=$('purpose').value.trim(),remarks=$('cremarks').value.trim();if(!purpose)return $('certMsg').textContent=' Enter the purpose.';const teachers=await assignedTeachers();const ref=db.collection('studentCertificateApplications').doc();await ref.set({studentRecordId:student.id,studentUid:uid,studentName:student.name||student.studentName||'',admissionNo:student.admissionNo||student.admissionNumber||'',assignedTeacherUids:teachers,certificateType:type,purpose,remarks,status:'Pending',teacherStatus:'Pending',hoiStatus:'Pending',certificateStatus:'Not Issued',createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});for(const t of teachers){try{await notify(t,'New student certificate request',(student.name||'Student')+' requested '+type+'.','studentCertificateApplications',ref.id)}catch(e){}}$('certMsg').textContent=' Submitted.';await loadHistory()}
async function loadHistory(){let rows=[];try{const a=await db.collection('studentLeaves').where('studentUid','==',uid).get();rows.push(...a.docs.map(d=>({kind:'Leave',id:d.id,...d.data()})))}catch(e){}try{const a=await db.collection('studentCertificateApplications').where('studentUid','==',uid).get();rows.push(...a.docs.map(d=>({kind:'Certificate',id:d.id,...d.data()})))}catch(e){}rows.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));$('history').innerHTML=rows.map(x=>`<div class="row"><b>${esc(x.kind)} — ${esc(x.certificateType||'Leave')}</b><span class="tag">${esc(x.status||x.hoiStatus||'Pending')}</span><div>${esc(x.reason||x.purpose||'')}</div><div class="muted">Teacher: ${esc(x.teacherStatus||'—')} · HOI: ${esc(x.hoiStatus||'—')}</div><div class="muted">${esc(x.hoiRemarks||x.adminRemarks||'')}</div></div>`).join('')||'<p class="muted">No applications yet.</p>'}
init().then(ok=>ok&&loadHistory()).catch(e=>alert(e.message));
</script></body></html>
