<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Leave Application</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="attachment-engine.js"></script><style>body{font-family:Arial;background:#f5f7fb;color:#17324a;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #12345612}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{font-weight:bold;display:block}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8e2ec;border-radius:10px;margin:6px 0 14px}button{border:0;border-radius:10px;padding:11px 16px;background:#5d3fd3;color:#fff;font-weight:bold}.row{border-top:1px solid #e8edf2;padding:12px 0}.status{padding:5px 10px;border-radius:999px;background:#eef2f7}</style></head><body><div class="wrap"><div class="card"><h1>Leave Application</h1><p id="who">Checking account…</p></div><div class="card"><form id="f"><div class="grid"><div><label>Leave Type</label><select id="type"><option>Casual Leave</option><option>Medical Leave</option><option>Other</option></select></div><div><label>Start Date</label><input id="start" type="date" required></div><div><label>End Date</label><input id="end" type="date" required></div><div><label>Supporting document</label><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"></div></div><label>Reason</label><textarea id="reason" rows="4" required></textarea><button id="submit">Submit</button><p id="msg"></p></form></div><div class="card"><h2>My Applications</h2><div id="list">Loading…</div></div></div><script>(async function(){const $=id=>document.getElementById(id);let auth,db,student;firebase.initializeApp(window.GPS_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const u=auth.currentUser;if(!u)return;const a=await db.collection('studentAccounts').doc(u.uid).get();if(!a.exists)throw Error('Student account record not found.');const ad=a.data();const sid=ad.studentRecordId||ad.sourceAdmissionId;if(!sid)throw Error('Student account has no linked Student Master ID.');const s=await db.collection('students').doc(sid).get();if(!s.exists)throw Error('Student Master record not found.');student={...ad,...s.data(),studentRecordId:sid};$('who').textContent='Student: '+(student.name||'')+' | Admission No: '+(student.admissionNo||'');const q=await db.collection('studentLeaves').where('studentRecordId','==',sid).get();let a2=[];q.forEach(d=>a2.push(d.data()));$('list').innerHTML=a2.length?a2.sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt))).map(x=>'<div class=row><b>'+esc(x.leaveType)+'</b> · '+esc(x.startDate)+' → '+esc(x.endDate)+'<br><span class=status>'+esc(x.status)+'</span><br>'+esc(x.reason)+(x.adminRemarks?'<br>Remark: '+esc(x.adminRemarks):'')+(x.attachment?.downloadURL?' · <a target=_blank href="'+x.attachment.downloadURL+'">Attachment</a>':'')+'</div>').join(''):'No applications yet.'}$('f').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const start=$('start').value,end=$('end').value;if(!start||!end||start>end)throw Error('Start date must be on or before end date.');let att=null,f=$('file').files[0];if(f)att=await GPSAttachment.upload(f,{root:'attachments/student-leaves',recordId:student.studentRecordId});await db.collection('studentLeaves').add({studentRecordId:student.studentRecordId,studentUid:auth.currentUser.uid,studentName:student.name||'',admissionNo:student.admissionNo||'',leaveType:$('type').value,startDate:start,endDate:end,reason:$('reason').value.trim(),status:'Pending',attachment:att,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});$('f').reset();$('msg').textContent='Application submitted.';load()}catch(e){$('msg').textContent=e.message}finally{$('submit').disabled=false}};auth.onAuthStateChanged(u=>u?load().catch(e=>$('msg').textContent=e.message):location.href='Student-Portal.html')})()</script></body></html>
