<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Documents & Certificates - GPS Pethgam Wagoora</title><link rel="stylesheet" href="module-common.css"></head><body><header><div class="head"><img class="logo" src="new-logo.png" onerror="this.style.display='none'"><div><h1>Student Documents & Certificates</h1><p>Central access to certificates and student documents.</p></div></div></header><main class="wrap"><a class="back" href="index.html">← Back to Dashboard</a>
<section class="card"><div class="grid"><div class="field"><label>Search Student</label><input id="q" placeholder="Student ID / Admission No. / Name"></div><div class="field"><label>Document Type</label><select id="doc"><option value="bonafide-certificate.html">Bonafide Certificate</option><option value="child-profile.html">Child Profile</option><option value="marksheet.html">Students Marksheet</option><option value="duty-certificate.html">Duty Certificate</option><option value="work-behaviour.html">Work & Behaviour</option></select></div></div><div class="actions"><button class="btn" onclick="search()">Find Student</button><a class="btn light" href="bonafide-certificate.html">Open Bonafide</a><a class="btn light" href="marksheet.html">Open Marksheet</a></div></section><section class="card"><div id="result">Search a student to generate/open a linked document.</div></section><section class="card"><h3>Other document tools</h3><div class="module-grid"><div class="module"><div class="icon">📄</div><h3>Admission Form</h3><a class="btn" href="admission.html">Open</a></div><div class="module"><div class="icon">📋</div><h3>General Register</h3><a class="btn" href="general_admission_register.html">Open</a></div><div class="module"><div class="icon">🧾</div><h3>School Letterhead</h3><a class="btn" href="school-lh.html">Open</a></div></div></section></main><script>
const KEY='GPSPETHGAM_MASTER_ADMISSION_V1';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function search(){let q=(document.getElementById('q').value||'').toLowerCase().trim();if(!q)return result.innerHTML='<p>Please enter a student name, Admission No. or Student ID.</p>';let a=data().filter(s=>(s.status||'Pending')!=='Rejected').filter(s=>JSON.stringify(s).toLowerCase().includes(q));result.innerHTML=a.length?a.map(s=>`<div class="card"><b>${s.studentName||s.name||'Student'}</b><p>Student ID: ${s.studentId||'—'} · Admission No.: ${s.admissionNo||'—'} · Class: ${s.class||s.className||'—'}</p><a class="btn" href="${doc.value}?id=${encodeURIComponent(s.id||s.studentId||'')}&admissionNo=${encodeURIComponent(s.admissionNo||'')}">Open Document</a></div>`).join(''):'<p>No matching student found.</p>'}
</script></body></html>
