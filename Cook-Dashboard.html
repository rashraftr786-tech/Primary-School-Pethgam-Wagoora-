<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cook Dashboard</title><style>:root{--b:#315ee8;--bg:#eef3f7;--line:#dfe6ee;--muted:#66758a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Arial;color:#172033}.top{background:linear-gradient(135deg,#315ee8,#4d46df);color:#fff;padding:18px}.toprow,.wrap{max-width:900px;margin:auto}.toprow{display:flex;justify-content:space-between;align-items:center}.logout,.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800}.logout{background:#ffffff22;color:#fff}.wrap{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #2939520e}.profile{margin-top:-5px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{font-size:20px;display:block}.btn{background:var(--b);color:#fff;cursor:pointer;margin-top:8px}.secondary{background:#eef2f7;color:#475569}.field{margin-top:10px}label{display:block;font-size:11px;font-weight:800;margin-bottom:4px}input,textarea{width:100%;padding:10px;border:1px solid #d6dee9;border-radius:10px}textarea{min-height:75px}.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:7px}.item b{display:block;font-size:12px}.item small{color:var(--muted)}.status{display:none;margin-top:10px;padding:9px;border-radius:10px;font-size:11px}.show{display:block}.ok{background:#ecfdf5;color:#087d56}.err{background:#fff1f0;color:#c33354}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script></head><body><header class="top"><div class="toprow"><div><b>Cook Dashboard</b><br><small>Government Primary School Pethgam Wagoora</small></div><button class="logout" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="card profile"><h1 id="name">Loading…</h1><div id="designation" class="muted">Checking account…</div><p class="muted">Access Role: Cook · <span id="employee">Employee ID: —</span></p></section><section class="grid"><div class="stat"><b id="today">—</b><span class="muted">Today</span></div><div class="stat"><b id="attendanceState">—</b><span class="muted">Attendance</span></div></section><section class="card"><h2>Attendance</h2><button class="btn" onclick="markAttendance('in')">Check In</button><button class="btn secondary" onclick="markAttendance('out')">Check Out</button><div id="attendanceList"></div></section><section class="card"><h2>Leave Application</h2><div class="field"><label>From</label><input id="leaveFrom" type="date"></div><div class="field"><label>To</label><input id="leaveTo" type="date"></div><div class="field"><label>Reason</label><textarea id="leaveReason"></textarea></div><button class="btn" onclick="submitLeave()">Submit Leave</button></section>EXTRA<section class="card"><div id="status" class="status"></div></section></main><script>'use strict';
const CONFIG={apiKey:"AIzaSyADB32wJq886NNqMuJk5n1zO45oSi-bdLs",authDomain:"gps-pethgam-wagoora-portal.firebaseapp.com",projectId:"gps-pethgam-wagoora-portal",storageBucket:"gps-pethgam-wagoora-portal.firebasestorage.app",messagingSenderId:"243117067000",appId:"1:243117067000:web:a5320441bcbaed71e4490d",measurementId:"G-WMXPK3229Y"};
const SESSION='GPSPETHGAM_COMMON_LOGIN_SESSION_V1',Cook='COOK',STAFF='staff',ATT='staffAttendance',LEAVE='staffLeaves';let auth,db,me,session;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function status(t,ok=false){const e=$('status');e.textContent=t;e.className='status show '+(ok?'ok':'err')}
async function waitForAuthUser(){
  if(auth.currentUser)return auth.currentUser;
  return await new Promise((resolve,reject)=>{
    let done=false;
    const timer=setTimeout(()=>{if(!done){done=true;unsub();reject(new Error('Firebase Authentication session is still restoring. Please sign in again.'));}},8000);
    const unsub=auth.onAuthStateChanged(u=>{if(u&&!done){done=true;clearTimeout(timer);unsub();resolve(u);}});
  });
}
async function boot(){try{if(!firebase.apps.length)firebase.initializeApp(CONFIG);auth=firebase.auth();db=firebase.firestore();session=JSON.parse(
      sessionStorage.getItem(SESSION) ||
      localStorage.getItem(SESSION) ||
      sessionStorage.getItem('GPSPETHGAM_ROLE_SESSION_V1') ||
      localStorage.getItem('GPSPETHGAM_ROLE_SESSION_V1') ||
      'null'
    );if(!session?.staffId||String(session.role).toUpperCase()!==Cook)throw Error('No valid Cook session. Please use Common Role Login.');const u=await waitForAuthUser();const d=await db.collection(STAFF).doc(session.staffId).get();if(!d.exists)throw Error('Staff record not found.');me={id:d.id,...d.data()};if(me.authUid&&me.authUid!==u.uid)throw Error('Firebase account is not linked to this staff record.');if(me.status==='Inactive'||me.active===false)throw Error('Staff account is inactive.');if(String(me.accessRole||'').toUpperCase()!==Cook)throw Error('Staff Access Role is not Cook. Correct it in Staff Management.');$('name').textContent=me.name||'Cook';$('designation').textContent=me.designation||me.roleDesignation||'Cook';$('employee').textContent='Employee ID: '+(me.employeeId||session.employeeId||'—');$('today').textContent=today();await loadAttendance();await loadExtra()}catch(e){status(e.message||'Dashboard failed');setTimeout(()=>location.href='Role-Login.html',5000)}}
async function loadAttendance(){try{const q=await db.collection(ATT).where('staffId','==',me.id).limit(30).get();const rows=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const rec=rows.find(x=>x.date===today());$('attendanceState').textContent=rec?.checkIn?'Checked In':'Not Marked';$('attendanceList').innerHTML=rows.map(x=>`<div class="item"><b>${esc(x.date||'')}</b><small>In: ${esc(x.checkIn||'—')} · Out: ${esc(x.checkOut||'—')}</small></div>`).join('')||'<p class="muted">No attendance records.</p>'}catch(e){$('attendanceState').textContent='Unavailable'}}
async function markAttendance(kind){try{const date=today(),id=me.id+'_'+date,ref=db.collection(ATT).doc(id),old=await ref.get(),data=old.exists?old.data():{staffId:me.id,staffAuthUid:auth.currentUser.uid,date};data.staffAuthUid=auth.currentUser.uid;if(kind==='in')data.checkIn=new Date().toLocaleTimeString('en-IN');else data.checkOut=new Date().toLocaleTimeString('en-IN');await ref.set(data,{merge:true});status('Attendance saved.',true);await loadAttendance()}catch(e){status(e.message||'Attendance could not be saved.')}}
async function submitLeave(){try{const from=$('leaveFrom').value,to=$('leaveTo').value,reason=$('leaveReason').value.trim();if(!from||!to||!reason)throw Error('Enter From, To and Reason.');await db.collection(LEAVE).add({staffId:me.id,staffAuthUid:auth.currentUser.uid,staffName:me.name||'',from,to,reason,decision:'Pending',createdAt:new Date().toISOString()});$('leaveReason').value='';status('Leave application submitted.',true)}catch(e){status(e.message||'Leave could not be submitted.')}}
async function loadExtra(){const q=await db.collection('mdmDaily').where('cookId','==',me.id).limit(30).get();const box=document.createElement('section');box.className='card';box.innerHTML='<h2>Mid-Day Meal Records</h2><div>'+q.docs.map(d=>{const x=d.data()||{};return '<div class="item"><b>'+esc(x.date||'Meal Record')+'</b><small>Meals: '+esc(x.mealsServed||x.studentsServed||'—')+' · Menu: '+esc(x.menu||x.menuItem||'—')+'</small></div>'}).join('')||'<p class="muted">No meal records.</p>'+'</div>';document.querySelector('.wrap').appendChild(box);const s=await db.collection('riceStock').orderBy('date','desc').limit(20).get();const stock=document.createElement('section');stock.className='card';stock.innerHTML='<h2>Rice Stock</h2><div>'+s.docs.map(d=>{const x=d.data()||{};return '<div class="item"><b>'+esc(x.date||'Stock Record')+'</b><small>Opening: '+esc(x.opening||'—')+' · Received: '+esc(x.received||'—')+' · Closing: '+esc(x.closing||x.balance||'—')+'</small></div>'}).join('')||'<p class="muted">No stock records.</p>'+'</div>';document.querySelector('.wrap').appendChild(stock)}
function logout(){sessionStorage.removeItem(SESSION);['loginRole','schoolLoginRole','staffId','employeeId','staffAuthUid','staffSession'].forEach(k=>sessionStorage.removeItem(k));auth.signOut().finally(()=>location.href='Role-Login.html')}
boot();</script></body></html>
