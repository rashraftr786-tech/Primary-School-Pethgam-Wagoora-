<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOI Official Applications</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="attachment-engine.js"></script><style>body{font-family:Arial;background:#f5f7fb;color:#17324a}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 14px;border:1px solid #d8e2ec;border-radius:10px}button{padding:10px 14px;border:0;border-radius:10px;background:#5d3fd3;color:#fff;font-weight:bold}.item{border-top:1px solid #ddd;padding:12px 0}</style></head><body><div class=wrap><div class=card><h1>HOI Official Applications & Documents</h1><p id=gate>Checking access…</p></div><div class=card><form id=f><label>Application Type</label><select id=type><option>Official Correspondence</option><option>Certificate / Document Request</option><option>Departmental Application</option><option>Other</option></select><label>Title</label><input id=title required><label>Details</label><textarea id=details rows=5 required></textarea><label>Supporting document</label><input id=file type=file accept=".pdf,.jpg,.jpeg,.png,.webp"><button>Save Application</button><p id=msg></p></form></div><div class=card><h2>Previous Applications</h2><div id=list>Loading…</div></div></div><script>(function(){let auth,db;firebase.initializeApp(window.GPS_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const q=await db.collection('officialApplications').orderBy('createdAt','desc').get();let a=[];q.forEach(d=>a.push(d.data()));$('list').innerHTML=a.length?a.map(x=>'<div class=item><b>'+esc(x.title)+'</b> · '+esc(x.type)+'<br>Status: '+esc(x.status)+'<br>'+esc(x.details)+(x.attachment?.downloadURL?' · <a target=_blank href="'+x.attachment.downloadURL+'">Attachment</a>':'')+'</div>').join(''):'No applications.'}$('f').onsubmit=async e=>{e.preventDefault();try{let att=null,f=$('file').files[0];if(f)att=await GPSAttachment.upload(f,{root:'attachments/official-applications',recordId:auth.currentUser.uid});await db.collection('officialApplications').add({type:$('type').value,title:$('title').value.trim(),details:$('details').value.trim(),status:'Draft',attachment:att,createdBy:auth.currentUser.uid,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});$('f').reset();$('msg').textContent='Saved.';load()}catch(e){$('msg').textContent=e.message}};auth.onAuthStateChanged(async u=>{if(!u)return location.href='Role-Login.html';const d=await db.collection('admins').doc(u.uid).get();if(!d.exists||d.data().active!==true||!['admin','hoi'].includes(String(d.data().role).toLowerCase()))return $('gate').textContent='Unauthorized.';$('gate').textContent='Access verified.';load()})})()</script></body></html>
